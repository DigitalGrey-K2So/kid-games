<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Splash Blast</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kid Games">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: sticker book, seaside edition. Header strip, then one big 3D window: a toy cannon on a dock aimed at a floating block island. */
:root{
  --page:#7FD3F5;
  --page-dot:#6CC8EE;
  --ink:#16325C;
  --paper:#FFFDF5;
  --go:#FFD84D;
  --font-display:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --font-body:'Nunito','Avenir Next','Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background-color:var(--page);
  background-image:radial-gradient(var(--page-dot) 18%,transparent 19%);
  background-size:44px 44px;
  color:var(--ink);font-family:var(--font-body);font-weight:700;
  overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding:12px 16px 16px}
.sticker{font-family:var(--font-display);font-weight:600;color:var(--ink);background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink)}
button{cursor:pointer;font:inherit;color:inherit}
button.sticker:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}
#info{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,5vw,40px);line-height:1;margin:0;margin-right:auto;letter-spacing:.5px;text-shadow:3px 3px 0 var(--paper)}
.stat{display:flex;align-items:center;gap:8px;padding:4px 16px 4px 12px;font-size:26px;font-variant-numeric:tabular-nums;min-height:56px}
.stat svg{width:30px;height:30px}
.stat small{font-size:16px;font-family:var(--font-body);font-weight:800}
.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.2) rotate(-5deg)}}
a.mini{text-decoration:none}
a.mini:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.mini{min-height:54px;min-width:54px;padding:0 12px;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.mini svg{width:24px;height:24px}
#stage{flex:1;min-height:0;position:relative;border:6px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);overflow:hidden;background:#BFE8FF}
#view{display:block;width:100%;height:100%;touch-action:none}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:6px 16px;font-size:18px;white-space:nowrap;pointer-events:none;z-index:1}
#overlay{position:absolute;inset:0;display:grid;place-items:center;z-index:3;background:rgba(22,50,92,.18)}
#overlay[hidden]{display:none}
#card{padding:20px 28px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:min(94%,540px);max-height:96%;overflow:auto}
#card h2{font-family:var(--font-display);font-weight:700;font-size:34px;margin:0;text-wrap:balance}
#cardSub{margin:0;font-size:18px}
#cardSub:empty{display:none}
#cardStars{display:flex;gap:8px}
#cardStars:empty{display:none}
#cardStars svg{width:52px;height:52px}
#btnRow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
#playBtn{background:var(--go);font-size:30px;padding:12px 38px;min-height:74px;border-radius:26px}
#moreBtn{background:#7BE38F;font-size:22px;padding:10px 24px;min-height:64px;border-radius:22px}
#moreBtn[hidden]{display:none}
#opts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:4px}
#toast{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%) scale(0);z-index:2;pointer-events:none;padding:8px 22px;font-size:clamp(24px,5vw,36px);white-space:nowrap;background:var(--go)}
#toast.show{animation:pop 1.1s both}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0) rotate(-8deg)}18%{transform:translate(-50%,-50%) scale(1.1) rotate(3deg)}28%,78%{transform:translate(-50%,-50%) scale(1) rotate(-2deg);opacity:1}100%{transform:translate(-50%,-50%) scale(.9);opacity:0}}
@media (prefers-reduced-motion:reduce){#toast.show{animation:none;transform:translate(-50%,-50%) scale(1)}.bump{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header id="info">
    <h1>Splash Blast</h1>
    <div id="targetBox" class="sticker stat" aria-live="polite" aria-label="Jelly blobs left">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="5" fill="#7BE38F" stroke="#16325C" stroke-width="1.8"/><circle cx="9" cy="11" r="2" fill="#16325C"/><circle cx="15" cy="11" r="2" fill="#16325C"/><path d="M9 15q3 2.5 6 0" fill="none" stroke="#16325C" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span id="targets">0</span>
    </div>
    <div id="ballBox" class="sticker stat" aria-label="Balls left">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#FF5A5F" stroke="#16325C" stroke-width="1.8"/><path d="M5 9q7 4 14 0" fill="none" stroke="#FFD84D" stroke-width="2.4"/><circle cx="9" cy="8" r="1.6" fill="#fff" opacity=".7"/></svg>
      <span id="balls">0</span>
    </div>
    <div class="sticker stat"><small>Level</small><span id="level">1</span></div>
    <button id="retryBtn" class="sticker mini" aria-label="Start this level over">
      <svg viewBox="0 0 24 24" fill="none" stroke="#16325C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.6-5.7M17.5 2.5v4.6h-4.6"/></svg>
    </button>
    <a id="homeBtn" href="index.html" class="sticker mini" aria-label="Back to all games">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5L12 4l8.5 7.5" fill="none" stroke="#16325C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9.5h4.5v-5h3v5H18V10" fill="none" stroke="#16325C" stroke-width="2.6" stroke-linejoin="round"/></svg>
    </a>
    <button id="pauseBtn" class="sticker mini" aria-label="Pause">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5" fill="#16325C"/><rect x="14" y="4" width="5" height="16" rx="1.5" fill="#16325C"/></svg>
    </button>
  </header>
  <main id="stage">
    <canvas id="view" aria-label="3D island of blocks"></canvas>
    <div id="hint" class="sticker">Touch to aim. Let go to shoot!</div>
    <div id="toast" class="sticker" aria-hidden="true"></div>
    <div id="overlay">
      <div id="card" class="sticker">
        <h2 id="cardTitle">Splash the jelly blobs!</h2>
        <div id="cardStars"></div>
        <p id="cardSub">Knock every jelly blob off the island. Hit a red BOOM box for a big blast.</p>
        <div id="btnRow">
          <button id="playBtn" class="sticker">Play</button>
          <button id="moreBtn" class="sticker" hidden>3 more balls</button>
        </div>
        <div id="opts">
          <button id="soundBtn" class="sticker mini" aria-pressed="true">Sound on</button>
          <button id="firstBtn" class="sticker mini">Start from level 1</button>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="kidkit.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
(function(){
'use strict';
var KG=window.KG||{init:function(){},hard:function(){return false;},boost:function(){return 1;},error:function(){},banner:function(){},speak:function(){},pickWord:function(){return {word:'cat',pic:''};},wordBar:function(){return null;}};
function $(id){return document.getElementById(id);}
var overlay=$('overlay');
function showProblem(msg){
  $('cardTitle').textContent='The game could not start';
  $('cardSub').textContent=msg;
  $('playBtn').hidden=true;$('moreBtn').hidden=true;
  overlay.hidden=false;
}
if(typeof THREE==='undefined'||typeof CANNON==='undefined'){
  showProblem('It needs the internet the first time it opens, to load its 3D tools. Connect to WiFi and open it again.');
  return;
}
window.addEventListener('error',function(e){showProblem('Something went wrong: '+(e.message||'unknown error')+'. Tell your grown up!');});

/* ---------- levels: blocks sit on an island whose top is at height 0 ---------- */
var C=.8,B=.9;
function L(balls,items){return {balls:balls,items:items};}
var LEVELS=[
  L(5,[['wood',-1.3,0,-6,.6,1.6,.6],['wood',1.3,0,-6,.6,1.6,.6],['plank',0,1.6,-6,3.4,.3,1.1],
       ['target',-.9,1.9,-6,C,C,C],['target',0,1.9,-6,C,C,C],['target',.9,1.9,-6,C,C,C]]),
  L(5,[['wood',-1,0,-6,1,1,1],['boom',0,0,-6,1,1,1],['wood',1,0,-6,1,1,1],['wood',-.5,1,-6,1,1,1],['wood',.5,1,-6,1,1,1],
       ['target',0,2,-6,B,B,B],['target',-2.4,0,-6,B,B,B],['target',2.4,0,-6,B,B,B]]),
  L(4,[['stone',-2,0,-6,C,C,C],['wood',-2,C,-6,C,C,C],['target',-2,2*C,-6,C,C,C],
       ['stone',2,0,-6,C,C,C],['wood',2,C,-6,C,C,C],['target',2,2*C,-6,C,C,C],
       ['boom',0,0,-6,C,C,C],['target',0,C,-6,C,C,C]]),
  L(6,[['stone',-1.6,0,-4.3,C,C,C],['stone',-.8,0,-4.3,C,C,C],['stone',0,0,-4.3,C,C,C],['stone',.8,0,-4.3,C,C,C],['stone',1.6,0,-4.3,C,C,C],
       ['stone',-1.2,C,-4.3,C,C,C],['stone',-.4,C,-4.3,C,C,C],['stone',.4,C,-4.3,C,C,C],['stone',1.2,C,-4.3,C,C,C],
       ['wood',-1.6,0,-7,C,C,C],['boom',0,0,-7,C,C,C],['wood',1.6,0,-7,C,C,C],
       ['target',-1.6,C,-7,C,C,C],['target',0,C,-7,C,C,C],['target',1.6,C,-7,C,C,C]]),
  L(5,[['wood',0,0,-6,B,B,B],['wood',0,B,-6,B,B,B],['wood',0,2*B,-6,B,B,B],['wood',0,3*B,-6,B,B,B],['target',0,4*B,-6,B,B,B],
       ['boom',-1.7,0,-6,B,B,B],['target',-1.7,B,-6,B,B,B],['stone',1.7,0,-6,B,B,B],['target',1.7,B,-6,B,B,B]]),
  L(7,[['wood',-1.3,0,-4.8,.6,1.6,.6],['wood',1.3,0,-4.8,.6,1.6,.6],['plank',0,1.6,-4.8,3.4,.3,1.1],['target',-.9,1.9,-4.8,C,C,C],['target',.9,1.9,-4.8,C,C,C],
       ['wood',-1.2,0,-7.5,1,1,1],['boom',0,0,-7.5,1,1,1],['wood',1.2,0,-7.5,1,1,1],['plank',0,1,-7.5,3.6,.3,1.1],
       ['target',-1.1,1.3,-7.5,C,C,C],['target',0,1.3,-7.5,C,C,C],['target',1.1,1.3,-7.5,C,C,C]])
];
var MASS={wood:1,plank:1.2,stone:4,boom:1,target:.8};
var MUZZLE=new THREE.Vector3(0,1.5,6.2),G=9.82;

/* ---------- textures drawn in code ---------- */
function tex(draw){
  var c=document.createElement('canvas');c.width=c.height=128;var x=c.getContext('2d');draw(x);
  var t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;
}
var TEX={
  wood:tex(function(x){x.fillStyle='#D9A066';x.fillRect(0,0,128,128);x.strokeStyle='#B97F45';x.lineWidth=4;for(var i=0;i<7;i++){x.beginPath();x.moveTo(0,10+i*18);x.bezierCurveTo(40,4+i*18,80,20+i*18,128,10+i*18);x.stroke();}x.strokeStyle='#8A5A33';x.lineWidth=8;x.strokeRect(4,4,120,120);}),
  stone:tex(function(x){x.fillStyle='#A9B4C2';x.fillRect(0,0,128,128);for(var i=0;i<40;i++){x.fillStyle=i%2?'#95A1B1':'#BCC6D2';x.beginPath();x.arc(Math.random()*128,Math.random()*128,3+Math.random()*7,0,7);x.fill();}x.strokeStyle='#7D8898';x.lineWidth=8;x.strokeRect(4,4,120,120);}),
  boom:tex(function(x){x.fillStyle='#FF4D5A';x.fillRect(0,0,128,128);x.fillStyle='#FFD84D';x.beginPath();for(var i=0;i<16;i++){var r=i%2?26:52,a=i*Math.PI/8;x.lineTo(64+Math.cos(a)*r,64+Math.sin(a)*r);}x.closePath();x.fill();x.fillStyle='#16325C';x.font='bold 30px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('BOOM',64,66);x.strokeStyle='#B5232F';x.lineWidth=8;x.strokeRect(4,4,120,120);}),
  target:tex(function(x){x.fillStyle='#7BE38F';x.fillRect(0,0,128,128);x.fillStyle='rgba(255,255,255,.35)';x.beginPath();x.ellipse(36,26,20,10,-.3,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(44,58,15,0,7);x.arc(84,58,15,0,7);x.fill();x.fillStyle='#16325C';x.beginPath();x.arc(47,60,7,0,7);x.arc(87,60,7,0,7);x.fill();x.strokeStyle='#16325C';x.lineWidth=6;x.lineCap='round';x.beginPath();x.arc(64,80,16,.2*Math.PI,.8*Math.PI);x.stroke();x.fillStyle='#FF9BC8';x.beginPath();x.ellipse(30,82,9,6,0,0,7);x.ellipse(98,82,9,6,0,0,7);x.fill();}),
  sand:tex(function(x){x.fillStyle='#F2D38A';x.fillRect(0,0,128,128);for(var i=0;i<60;i++){x.fillStyle=i%2?'#E6C276':'#FBE3A6';x.fillRect(Math.random()*128,Math.random()*128,3,3);}})
};
TEX.plank=TEX.wood;
var MAT={};
['wood','plank','stone','boom','target'].forEach(function(k){MAT[k]=new THREE.MeshLambertMaterial({map:TEX[k]});});

/* ---------- scene ---------- */
var canvas=$('view'),stage=$('stage'),toastEl=$('toast');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
var scene=new THREE.Scene();
scene.background=new THREE.Color('#BFE8FF');
scene.fog=new THREE.Fog('#BFE8FF',30,70);
var camera=new THREE.PerspectiveCamera(50,1,.1,200);
scene.add(new THREE.HemisphereLight('#FFFFFF','#7FB7D6',.75));
var sun=new THREE.DirectionalLight('#FFF4D6',.85);
sun.position.set(6,14,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
var sc=sun.shadow.camera;sc.left=-10;sc.right=10;sc.top=10;sc.bottom=-10;sc.near=1;sc.far=40;
scene.add(sun);

var water=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshLambertMaterial({color:'#4FB3E8'}));
water.rotation.x=-Math.PI/2;water.position.y=-2.5;scene.add(water);
var island=new THREE.Mesh(new THREE.BoxGeometry(9,1,6),[MATS('#C9A46A'),MATS('#C9A46A'),new THREE.MeshLambertMaterial({map:TEX.sand}),MATS('#C9A46A'),MATS('#C9A46A'),MATS('#C9A46A')]);
function MATS(c){return new THREE.MeshLambertMaterial({color:c});}
island.position.set(0,-.5,-6);island.receiveShadow=true;scene.add(island);
var post;for(var pi=0;pi<4;pi++){post=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,3,10),MATS('#8A5A33'));post.position.set(pi<2?-4:4,-2,pi%2?-3.4:-8.6);scene.add(post);}
var dock=new THREE.Mesh(new THREE.BoxGeometry(3,.4,3),MATS('#B07A47'));dock.position.set(0,.3,6.8);dock.receiveShadow=true;scene.add(dock);
/* toy cannon */
var cannon=new THREE.Group();cannon.position.set(0,1,6.8);scene.add(cannon);
var wheelMat=MATS('#16325C');
[-.55,.55].forEach(function(x){var w=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.18,18),wheelMat);w.rotation.z=Math.PI/2;w.position.set(x,-.2,0);cannon.add(w);});
var cbody=new THREE.Mesh(new THREE.BoxGeometry(.9,.4,1),MATS('#FFD84D'));cbody.position.y=-.2;cannon.add(cbody);
var barrel=new THREE.Group();cannon.add(barrel);
var tube=new THREE.Mesh(new THREE.CylinderGeometry(.28,.34,1.6,18),MATS('#FF6FA8'));tube.rotation.x=Math.PI/2;tube.position.z=.55;tube.castShadow=true;barrel.add(tube);
var rim=new THREE.Mesh(new THREE.TorusGeometry(.3,.07,8,18),MATS('#16325C'));rim.position.z=1.35;barrel.add(rim);
/* aiming dots */
var dots=[],dotMat=new THREE.MeshBasicMaterial({color:'#FFFFFF',transparent:true,opacity:.9});
for(var di=0;di<22;di++){var d=new THREE.Mesh(new THREE.SphereGeometry(.09,8,6),dotMat);d.visible=false;scene.add(d);dots.push(d);}
var aimRing=new THREE.Mesh(new THREE.TorusGeometry(.35,.06,8,24),new THREE.MeshBasicMaterial({color:'#FFD84D'}));aimRing.visible=false;scene.add(aimRing);

/* ---------- physics ---------- */
var world=new CANNON.World();
world.gravity.set(0,-G,0);
world.broadphase=new CANNON.NaiveBroadphase();
world.solver.iterations=12;
world.allowSleep=true;
world.defaultContactMaterial.friction=.45;
world.defaultContactMaterial.restitution=.12;
var ground=new CANNON.Body({mass:0,shape:new CANNON.Box(new CANNON.Vec3(4.5,.5,3)),position:new CANNON.Vec3(0,-.5,-6)});
world.addBody(ground);
var dockBody=new CANNON.Body({mass:0,shape:new CANNON.Box(new CANNON.Vec3(1.5,.2,1.5)),position:new CANNON.Vec3(0,.3,6.8)});
world.addBody(dockBody);

var S={sound:true,level:1};
var things=[],balls=[],pending=[],bits=[],ballsLeft=0,targetsLeft=0,lastShot=-99,clock=0,levelT=0,playing=false,ended=false,used=0;

function removeBody(b){if(world.removeBody)world.removeBody(b);else world.remove(b);}
function clearLevel(){
  things.concat(balls).forEach(function(o){scene.remove(o.mesh);removeBody(o.body);});
  bits.forEach(function(p){scene.remove(p.mesh);});
  things=[];balls=[];pending=[];bits=[];
}
function loadLevel(){
  clearLevel();
  var lv=LEVELS[(S.level-1)%LEVELS.length];
  ballsLeft=lv.balls;targetsLeft=0;used=0;ended=false;levelT=0;lastShot=-99;
  lv.items.forEach(function(it){
    var k=it[0],w=it[4],h=it[5],dd=it[6];
    var body=new CANNON.Body({mass:MASS[k]*w*h*dd*1.6,shape:new CANNON.Box(new CANNON.Vec3(w/2,h/2,dd/2)),position:new CANNON.Vec3(it[1],it[2]+h/2+.001,it[3])});
    body.linearDamping=.05;body.angularDamping=.12;body.sleepSpeedLimit=.25;body.sleepTimeLimit=.6;
    world.addBody(body);
    body.sleep(); /* towers stand still until something hits them */
    var mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,dd),MAT[k]);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);
    var o={kind:k,body:body,mesh:mesh,startY:body.position.y,gone:false};
    body.addEventListener('collide',function(e){onHit(o,e);});
    things.push(o);
    if(k==='target')targetsLeft++;
  });
  $('level').textContent=S.level;showCounts();
}
function impact(e){
  try{return Math.abs(e.contact.getImpactVelocityAlongNormal());}
  catch(err){return e.body.velocity.vsub(e.target.velocity).norm();}
}
function onHit(o,e){
  if(o.gone||levelT<.4)return;
  var v=impact(e),byBall=e.body&&e.body.isBall;
  if(o.kind==='target'&&(byBall||v>2.6))pending.push({o:o,what:'pop'});
  if(o.kind==='boom'&&(byBall||v>3))pending.push({o:o,what:'boom'});
}
function pop(o,splash){
  if(o.gone)return;o.gone=true;
  scene.remove(o.mesh);removeBody(o.body);
  burst(o.body.position,splash?'#FFFFFF':'#7BE38F',splash?10:16);
  targetsLeft--;showCounts(true);
  if(splash)sfx.splash();else sfx.pop();
  if(targetsLeft>0&&Math.random()<.5)toast(['Pop!','Splash!','Boing!','Nice shot!'][Math.floor(Math.random()*4)]);
  if(targetsLeft===0&&!ended){ended=true;sfx.win();toast('All splashed!');setTimeout(win,1300);}
}
function boom(o){
  if(o.gone)return;o.gone=true;
  var p=o.body.position;
  scene.remove(o.mesh);removeBody(o.body);
  burst(p,'#FFB52E',26);flash(p);sfx.boom();toast('BOOM!');
  things.forEach(function(t){
    if(t.gone)return;
    var dv=t.body.position.vsub(p),dist=dv.norm(),R=3.6;
    if(dist>R)return;
    var push=dv.unit();push.y+=.6;
    t.body.wakeUp();
    t.body.applyImpulse(push.scale(t.body.mass*9*(1-dist/R)+1),t.body.position);
    if(t.kind==='target'&&dist<2.2)pending.push({o:t,what:'pop'});
    if(t.kind==='boom'&&dist<2.6)pending.push({o:t,what:'boom'});
  });
}

/* ---------- shooting ---------- */
var aim=null;
function launchVelocity(P){
  var dv=P.clone().sub(MUZZLE),T=dv.length()/15+.35;
  return {v:dv.multiplyScalar(1/T).add(new THREE.Vector3(0,.5*G*T,0)),T:T};
}
function showAim(P){
  var lv=launchVelocity(P),v=lv.v;
  barrel.lookAt(barrel.getWorldPosition(new THREE.Vector3()).add(v));
  for(var i=0;i<dots.length;i++){
    var t=lv.T*(i+1)/(dots.length+1);
    dots[i].position.set(MUZZLE.x+v.x*t,MUZZLE.y+v.y*t-.5*G*t*t,MUZZLE.z+v.z*t);
    dots[i].visible=true;
  }
  aimRing.position.copy(P);aimRing.lookAt(camera.position);aimRing.visible=true;
}
function hideAim(){dots.forEach(function(d){d.visible=false;});aimRing.visible=false;}
function fire(P){
  if(ballsLeft<=0||ended)return;
  var v=launchVelocity(P).v;
  var body=new CANNON.Body({mass:6,shape:new CANNON.Sphere(.32),position:new CANNON.Vec3(MUZZLE.x,MUZZLE.y,MUZZLE.z)});
  body.isBall=true;body.linearDamping=.01;body.angularDamping=.3;
  body.velocity.set(v.x,v.y,v.z);
  world.addBody(body);
  var mesh=new THREE.Mesh(new THREE.SphereGeometry(.32,20,14),MATS(['#FF5A5F','#5CB8FF','#FFD84D','#B57BFF'][used%4]));mesh.castShadow=true;scene.add(mesh);
  balls.push({body:body,mesh:mesh,born:clock});
  ballsLeft--;used++;lastShot=clock;showCounts();sfx.fire();
  burst(MUZZLE,'#FFFFFF',6);
  barrel.position.z=-.25;
}
var ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),backPlane=new THREE.Plane(new THREE.Vector3(0,0,1),6);
function aimPoint(e){
  var r=canvas.getBoundingClientRect();
  ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  var meshes=things.filter(function(t){return !t.gone;}).map(function(t){return t.mesh;});meshes.push(island);
  var hit=ray.intersectObjects(meshes,false);
  if(hit.length&&hit[0].point.z<2)return hit[0].point;
  var p=new THREE.Vector3();
  if(ray.ray.intersectPlane(backPlane,p)){p.y=Math.max(-.5,Math.min(8,p.y));p.x=Math.max(-7,Math.min(7,p.x));return p;}
  return null;
}
canvas.addEventListener('pointerdown',function(e){
  if(!playing||ended)return;e.preventDefault();
  try{canvas.setPointerCapture(e.pointerId);}catch(err){}
  aim={id:e.pointerId,p:aimPoint(e)};if(aim.p)showAim(aim.p);
  $('hint').hidden=true;
});
canvas.addEventListener('pointermove',function(e){
  if(!aim||e.pointerId!==aim.id)return;
  var p=aimPoint(e);if(p){aim.p=p;showAim(p);}
});
canvas.addEventListener('pointerup',function(e){
  if(!aim||e.pointerId!==aim.id)return;
  if(aim.p&&playing&&clock-lastShot>.5)fire(aim.p);
  aim=null;hideAim();
});
canvas.addEventListener('pointercancel',function(){aim=null;hideAim();});
document.addEventListener('gesturestart',function(e){e.preventDefault();});

/* ---------- little effects ---------- */
var bitGeo=new THREE.BoxGeometry(.16,.16,.16);
function burst(p,col,n){
  var m=new THREE.MeshBasicMaterial({color:col});
  for(var i=0;i<n;i++){
    var mesh=new THREE.Mesh(bitGeo,m);mesh.position.set(p.x,p.y,p.z);scene.add(mesh);
    bits.push({mesh:mesh,v:new THREE.Vector3((Math.random()-.5)*7,Math.random()*6+2,(Math.random()-.5)*7),life:.7+Math.random()*.5});
  }
}
function flash(p){
  var m=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),new THREE.MeshBasicMaterial({color:'#FFD84D',transparent:true,opacity:.8}));
  m.position.set(p.x,p.y,p.z);scene.add(m);
  bits.push({mesh:m,v:new THREE.Vector3(),life:.45,grow:true});
}

/* ---------- loop ---------- */
function update(dt){
  clock+=dt;levelT+=dt;
  world.step(1/60,dt,4);
  var todo=pending;pending=[];
  todo.forEach(function(q){if(q.what==='pop')pop(q.o,false);else boom(q.o);});
  things.forEach(function(t){
    if(t.gone)return;
    t.mesh.position.copy(t.body.position);t.mesh.quaternion.copy(t.body.quaternion);
    if(t.body.position.y<-2.2){
      if(t.kind==='target')pop(t,true);
      else{t.gone=true;scene.remove(t.mesh);removeBody(t.body);burst(t.body.position,'#FFFFFF',6);sfx.splash();}
    }
  });
  for(var i=balls.length-1;i>=0;i--){
    var b=balls[i];
    b.mesh.position.copy(b.body.position);b.mesh.quaternion.copy(b.body.quaternion);
    if(b.body.position.y<-3||clock-b.born>7){scene.remove(b.mesh);removeBody(b.body);balls.splice(i,1);}
  }
  barrel.position.z+=(0-barrel.position.z)*Math.min(1,dt*8);
  if(!ended&&ballsLeft===0&&targetsLeft>0&&clock-lastShot>4.5&&!balls.length){ended=true;outOfBalls();}
}
function animateBits(dt){
  for(var i=bits.length-1;i>=0;i--){
    var p=bits[i];p.life-=dt;
    if(p.grow){var s=1+(.45-p.life)*7;p.mesh.scale.set(s,s,s);p.mesh.material.opacity=Math.max(0,p.life*1.8);}
    else{p.v.y-=14*dt;p.mesh.position.addScaledVector(p.v,dt);p.mesh.rotation.x+=dt*6;}
    if(p.life<=0){scene.remove(p.mesh);bits.splice(i,1);}
  }
}
var last=performance.now();
function frame(t){
  var dt=Math.min(1/30,(t-last)/1000);last=t;
  if(dt>0){
    if(playing)update(dt);
    animateBits(dt);
    water.material.color.setHSL(.55,.7,.6+Math.sin(t/900)*.02);
  }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
function resize(){
  var w=stage.clientWidth,h=stage.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  /* stand farther back when the iPad is upright so the whole island fits */
  var back=camera.aspect<1?(1/camera.aspect-1)*9:0;
  camera.position.set(0,5.4+back*.35,12+back);
  camera.lookAt(0,.8,-5);
  camera.updateProjectionMatrix();
}

/* ---------- UI ---------- */
var toastTimer=null;
function toast(msg){toastEl.textContent=msg;toastEl.classList.remove('show');void toastEl.offsetWidth;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastEl.classList.remove('show');},1150);}
function showCounts(bump){
  $('targets').textContent=targetsLeft;$('balls').textContent=ballsLeft;
  if(bump){var b=$('targetBox');b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');}
}
function starSvg(on){return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="'+(on?'#FFC400':'#E3E8F2')+'" stroke="#16325C" stroke-width="1.6" stroke-linejoin="round"/></svg>';}
function win(){
  playing=false;
  var stars=ballsLeft>=2?3:ballsLeft===1?2:1,lastLv=S.level%LEVELS.length===0;
  $('cardTitle').textContent=lastLv?'You splashed every island!':'Island cleared!';
  $('cardStars').innerHTML=starSvg(stars>0)+starSvg(stars>1)+starSvg(stars>2);
  $('cardSub').textContent=lastLv?'All '+LEVELS.length+' levels done. Play them again?':'Balls left over: '+ballsLeft;
  $('playBtn').textContent='Next level';$('playBtn').dataset.next='1';$('moreBtn').hidden=true;
  overlay.hidden=false;
  try{localStorage.setItem('splashBlast',JSON.stringify({sound:S.sound,level:S.level+1}));}catch(e){}
}
function outOfBalls(){
  KG.error();
  playing=false;
  $('cardTitle').textContent='Out of balls!';$('cardStars').innerHTML='';
  $('cardSub').textContent=targetsLeft+(targetsLeft===1?' jelly blob is':' jelly blobs are')+' still on the island.';
  $('playBtn').textContent='Start over';$('playBtn').dataset.next='retry';$('moreBtn').hidden=false;
  overlay.hidden=false;
}
var ac=null;
function initAudio(){try{if(!ac){var AC=window.AudioContext||window.webkitAudioContext;if(AC)ac=new AC();}if(ac&&ac.state==='suspended')ac.resume();}catch(e){ac=null;}}
function tone(f,d,type,v,when,f2){
  if(!ac||!S.sound)return;
  try{var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+(when||0);o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
var sfx={
  fire:function(){tone(160,.25,'triangle',.18,0,80);tone(900,.08,'square',.04,0,300);},
  pop:function(){tone(600,.14,'triangle',.13,0,1300);},
  splash:function(){tone(500,.3,'sine',.13,0,140);},
  boom:function(){tone(120,.5,'sawtooth',.14,0,40);tone(300,.3,'square',.06,0,60);},
  win:function(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,.2,'triangle',.12,i*.1);});}
};
function play(){
  initAudio();
  var n=$('playBtn').dataset.next;
  if(n==='1'){S.level++;loadLevel();}
  else if(n==='retry'){loadLevel();}
  $('playBtn').dataset.next='';$('cardStars').innerHTML='';$('moreBtn').hidden=true;
  playing=true;overlay.hidden=true;last=performance.now();
}
function pause(){
  if(!playing)return;playing=false;aim=null;hideAim();
  $('cardTitle').textContent='Taking a break';$('cardSub').textContent='';$('cardStars').innerHTML='';
  $('playBtn').textContent='Keep going';$('playBtn').dataset.next='';$('moreBtn').hidden=true;overlay.hidden=false;
}
$('playBtn').addEventListener('click',play);
$('moreBtn').addEventListener('click',function(){ballsLeft+=3;ended=false;lastShot=clock;showCounts();$('playBtn').dataset.next='';play();});
$('pauseBtn').addEventListener('click',pause);
$('retryBtn').addEventListener('click',function(){loadLevel();toast('Fresh island!');});
$('firstBtn').addEventListener('click',function(){S.level=1;loadLevel();$('playBtn').dataset.next='';$('playBtn').textContent='Play';$('cardTitle').textContent='Splash the jelly blobs!';$('cardSub').textContent='Back to level 1.';});
$('soundBtn').addEventListener('click',function(){S.sound=!S.sound;if(S.sound)initAudio();$('soundBtn').textContent=S.sound?'Sound on':'Sound off';$('soundBtn').setAttribute('aria-pressed',String(S.sound));try{localStorage.setItem('splashBlast',JSON.stringify({sound:S.sound,level:S.level}));}catch(e){}});
document.addEventListener('visibilitychange',function(){if(document.hidden)pause();});

try{var saved=JSON.parse(localStorage.getItem('splashBlast')||'{}');if(typeof saved.sound==='boolean')S.sound=saved.sound;if(typeof saved.level==='number'&&saved.level>=1)S.level=Math.floor(saved.level);}catch(e){}
$('soundBtn').textContent=S.sound?'Sound on':'Sound off';
loadLevel();resize();
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
window.addEventListener('resize',resize);
requestAnimationFrame(frame);
KG.init({game:'splash-blast',isPlaying:function(){return playing;},onBreak:function(){try{pause();}catch(e){}}});
})();
</script>
</body>
</html>
