<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bubble Bay</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kid Games">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: sticker book, under the sea. Header, then one tall ocean window: bubbles stuck to the top, a little whale blowing bubbles from the bottom. */
:root{
  --page:#9FE6E0;
  --page-dot:#8BDBD4;
  --ink:#1D3557;
  --paper:#FFFDF5;
  --go:#FFD84D;
  --font-display:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --font-body:'Nunito','Avenir Next','Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background-color:var(--page);
  background-image:radial-gradient(var(--page-dot) 18%,transparent 19%);
  background-size:44px 44px;
  color:var(--ink);font-family:var(--font-body);font-weight:700;
  overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding:12px 16px 16px}
.sticker{font-family:var(--font-display);font-weight:600;color:var(--ink);background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink)}
button{cursor:pointer;font:inherit;color:inherit}
button.sticker:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}
#info{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,5vw,40px);line-height:1;margin:0;margin-right:auto;letter-spacing:.5px;text-shadow:3px 3px 0 var(--paper)}
.stat{display:flex;align-items:center;gap:8px;padding:4px 16px 4px 12px;font-size:26px;font-variant-numeric:tabular-nums;min-height:56px}
.stat svg{width:30px;height:30px}
.stat small{font-size:16px;font-family:var(--font-body);font-weight:800}
.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.2) rotate(-5deg)}}
a.mini{text-decoration:none}
a.mini:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.mini{min-height:54px;min-width:54px;padding:0 12px;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.mini svg{width:24px;height:24px}
#stage{flex:1;min-height:0;position:relative}
#sea{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:6px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);background:#2E8FD0;touch-action:none}
#overlay{position:absolute;inset:0;display:grid;place-items:center;z-index:3}
#overlay[hidden]{display:none}
#card{padding:20px 28px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:min(96%,520px);max-height:98%;overflow:auto}
#card h2{font-family:var(--font-display);font-weight:700;font-size:32px;margin:0;text-wrap:balance}
#cardSub{margin:0;font-size:18px}
#cardSub:empty{display:none}
#cardStars{display:flex;gap:8px}
#cardStars:empty{display:none}
#cardStars svg{width:50px;height:50px}
#playBtn{background:var(--go);font-size:30px;padding:12px 38px;min-height:74px;border-radius:26px}
#levels{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#levels button{min-width:58px;min-height:54px;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:4px 10px}
#levels button small{font-size:12px;margin-top:3px;letter-spacing:1px}
#levels button[disabled]{opacity:.4;cursor:default}
#levels button.on{background:#FFE066}
#opts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.seg{display:flex;overflow:hidden;padding:0}
.seg button{border:0;background:transparent;padding:0 12px;min-height:46px;font-family:var(--font-display);font-weight:600;font-size:16px}
.seg button + button{border-left:3px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
#toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);z-index:2;pointer-events:none;padding:8px 22px;font-size:clamp(22px,4.5vw,34px);white-space:nowrap;background:#FFE066}
#toast.show{animation:pop 1.2s both}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0) rotate(-8deg)}18%{transform:translate(-50%,-50%) scale(1.1) rotate(3deg)}28%,78%{transform:translate(-50%,-50%) scale(1) rotate(-2deg);opacity:1}100%{transform:translate(-50%,-50%) scale(.9);opacity:0}}
@media (prefers-reduced-motion:reduce){#toast.show{animation:none;transform:translate(-50%,-50%) scale(1)}.bump{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header id="info">
    <h1>Bubble Bay</h1>
    <div id="scoreBox" class="sticker stat" aria-live="polite" aria-label="Bubbles popped">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#FF7AB6" stroke="#1D3557" stroke-width="1.8"/><circle cx="9" cy="8.5" r="2.4" fill="#fff" opacity=".7"/></svg>
      <span id="score">0</span>
    </div>
    <div class="sticker stat"><small>Level</small><span id="level">1</span></div>
    <a id="homeBtn" href="index.html" class="sticker mini" aria-label="Back to all games">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5L12 4l8.5 7.5" fill="none" stroke="#1D3557" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9.5h4.5v-5h3v5H18V10" fill="none" stroke="#1D3557" stroke-width="2.6" stroke-linejoin="round"/></svg>
    </a>
    <button id="pauseBtn" class="sticker mini" aria-label="Pause">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5" fill="#1D3557"/><rect x="14" y="4" width="5" height="16" rx="1.5" fill="#1D3557"/></svg>
    </button>
  </header>
  <main id="stage">
    <canvas id="sea" aria-label="Bubbles under the sea"></canvas>
    <div id="toast" class="sticker" aria-hidden="true"></div>
    <div id="overlay">
      <div id="card" class="sticker">
        <h2 id="cardTitle">Pop the bubbles!</h2>
        <div id="cardStars"></div>
        <p id="cardSub">Touch and drag to aim Wally's bubble. Let go to shoot. Match 3 of the same color to pop them!</p>
        <button id="playBtn" class="sticker">Play</button>
        <div id="levels" role="group" aria-label="Pick a level"></div>
        <div id="opts">
          <div class="seg sticker" role="group" aria-label="Colors">
            <button data-col="3" aria-pressed="true">3 colors</button>
            <button data-col="4" aria-pressed="false">4 colors</button>
            <button data-col="5" aria-pressed="false">5 colors</button>
          </div>
          <button id="soundBtn" class="sticker mini" aria-pressed="true">Sound on</button>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
(function(){
'use strict';
var R=24,D=R*2,COLS=11,RH=R*Math.sqrt(3),W=COLS*D,TOP=6,DANGER=13,H=Math.round(TOP+RH*DANGER+R+130),INK='#1D3557';
var COLORS=['#FF5A6E','#FFC93D','#4FD98A','#5CB8FF','#B57BFF'];
var FACES=['😊','😄','😮','😉','😋'];
/* level pictures: letters a to e are colors, dots are empty. rows alternate full and shifted */
var LEVELS=[
  ['aabbccaabbc','aabbccaabb','ccaabbccaab','ccaabbccaa'],
  ['abcabcabcab','bcabcabcab','cabcabcabca','abcabcabca','bcabcabcabc'],
  ['aaaa...bbbb','aaa....bbb','ccc.....ccc','cc.....cc','aaaabbbbccc','aabbbbccc.'],
  ['.aabbcbbaa.','.abccccba.','abccdddccba','abcdddcba.','.abcdddcba.','..abbbba..'],
  ['ddddddddddd','abcabcabca','bcabcabcabc','cabcabcabc','ddddddddddd','abcabcabca'],
  ['a.b.c.d.e.a','.b.c.d.e.a','ebdcaebdcae','ebdcaebdca','abcdeabcdea','abcdeabcde','eeddccbbaae']
];
function $(id){return document.getElementById(id);}
var cv=$('sea'),ctx=cv.getContext('2d'),stage=$('stage'),overlay=$('overlay'),toastEl=$('toast');
var reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var S={sound:true,score:0,level:1,best:0,colors:3,stars:[]};
var rows,shot,next,cur,aim=null,shots=0,misses=0,state='menu',playing=false,clock=0,last=0,scale=1,fallers=[],pops=[],bits=[];
var SX=W/2,SY=H-62;

/* ---------- the grid ---------- */
function rowLen(r){return rows[r].odd?COLS-1:COLS;}
function cellXY(r,c){return {x:R+c*D+(rows[r].odd?R:0),y:TOP+R+r*RH};}
function newRow(odd){var a=[];for(var i=0;i<(odd?COLS-1:COLS);i++)a.push(-1);a.odd=odd;return a;}
function loadLevel(n){
  S.level=n;var pic=LEVELS[(n-1)%LEVELS.length],nc=S.colors;
  rows=[];
  pic.forEach(function(line,r){
    var row=newRow(r%2===1);
    for(var c=0;c<row.length;c++){var ch=line[c];if(ch&&ch!=='.'){row[c]=(ch.charCodeAt(0)-97)%nc;}}
    rows.push(row);
  });
  while(rows.length<DANGER+1)rows.push(newRow(rows.length%2===1));
  shots=0;misses=0;fallers=[];pops=[];bits=[];shot=null;
  cur=pickColor();next=pickColor();
  $('level').textContent=n;
}
function present(){var s={};rows.forEach(function(r){r.forEach(function(v){if(v>=0)s[v]=1;});});return Object.keys(s).map(Number);}
function pickColor(){var p=present();if(!p.length)return Math.floor(Math.random()*S.colors);return p[Math.floor(Math.random()*p.length)];}
function neighbors(r,c){
  var odd=rows[r].odd,out=[[r,c-1],[r,c+1]];
  var a=odd?[c,c+1]:[c-1,c];
  [r-1,r+1].forEach(function(rr){if(rr<0||rr>=rows.length)return;a.forEach(function(cc){out.push([rr,cc]);});});
  return out.filter(function(p){return p[0]>=0&&p[0]<rows.length&&p[1]>=0&&p[1]<rowLen(p[0]);});
}
function addTopRow(){
  /* the ceiling creeps down one row after too many misses */
  var odd=!rows[0].odd,row=newRow(odd),p=present();
  for(var c=0;c<row.length;c++)row[c]=p.length?p[Math.floor(Math.random()*p.length)]:Math.floor(Math.random()*S.colors);
  rows.unshift(row);rows.pop();
  sfx.drop();
}

/* ---------- shooting ---------- */
var SPEED=1100;
function fire(){
  if(shot||!aim)return;
  var a=aim.angle;shot={x:SX,y:SY-26,vx:Math.cos(a)*SPEED,vy:Math.sin(a)*SPEED,c:cur};
  cur=next;next=pickColor();shots++;sfx.shoot();
}
function stepShot(dt){
  var steps=Math.ceil(SPEED*dt/8);
  for(var s=0;s<steps;s++){
    shot.x+=shot.vx*dt/steps;shot.y+=shot.vy*dt/steps;
    if(shot.x<R){shot.x=R;shot.vx=-shot.vx;sfx.bounce();}
    if(shot.x>W-R){shot.x=W-R;shot.vx=-shot.vx;sfx.bounce();}
    if(shot.y<=TOP+R){snap();return;}
    for(var r=0;r<rows.length;r++)for(var c=0;c<rowLen(r);c++){
      if(rows[r][c]<0)continue;var p=cellXY(r,c);
      if(Math.hypot(p.x-shot.x,p.y-shot.y)<D*.86){snap();return;}
    }
  }
}
function snap(){
  /* find the closest empty spot that touches the ceiling or another bubble */
  var best=null,bd=1e9;
  for(var r=0;r<rows.length;r++)for(var c=0;c<rowLen(r);c++){
    if(rows[r][c]>=0)continue;
    var ok=r===0||neighbors(r,c).some(function(n){return rows[n[0]][n[1]]>=0;});
    if(!ok)continue;
    var p=cellXY(r,c),d=Math.hypot(p.x-shot.x,p.y-shot.y);
    if(d<bd){bd=d;best=[r,c];}
  }
  var col=shot.c;shot=null;
  if(!best)return;
  rows[best[0]][best[1]]=col;
  /* same color cluster */
  var group=flood(best[0],best[1],function(v){return v===col;});
  if(group.length>=3){
    group.forEach(function(g,i){var p=cellXY(g[0],g[1]);pops.push({x:p.x,y:p.y,c:col,t:-i*.03});rows[g[0]][g[1]]=-1;});
    var dropped=dropFloaters();
    var gained=group.length+dropped*2;S.score+=gained;showScore();
    sfx.pop(group.length);
    if(dropped)toast(dropped>=5?'Huge drop! +'+gained:'Drop! +'+gained);
    else if(group.length>=5)toast('Super pop!');
    misses=Math.max(0,misses-1);
  }else{
    sfx.stick();misses++;
    if(misses>=missLimit()){misses=0;addTopRow();toast('The bubbles moved down!');}
  }
  check();
}
function missLimit(){return S.colors<=3?8:S.colors===4?7:6;}
function flood(r0,c0,test){
  var seen={},out=[],q=[[r0,c0]];seen[r0+','+c0]=1;
  while(q.length){var p=q.pop();out.push(p);neighbors(p[0],p[1]).forEach(function(n){var k=n[0]+','+n[1];if(!seen[k]&&rows[n[0]][n[1]]>=0&&test(rows[n[0]][n[1]])){seen[k]=1;q.push(n);}});}
  return out;
}
function dropFloaters(){
  var keep={};
  for(var c=0;c<rowLen(0);c++)if(rows[0][c]>=0)flood(0,c,function(){return true;}).forEach(function(p){keep[p[0]+','+p[1]]=1;});
  var n=0;
  for(var r=0;r<rows.length;r++)for(var cc=0;cc<rowLen(r);cc++){
    if(rows[r][cc]>=0&&!keep[r+','+cc]){var p=cellXY(r,cc);fallers.push({x:p.x,y:p.y,vy:-80-Math.random()*120,vx:(Math.random()-.5)*120,c:rows[r][cc]});rows[r][cc]=-1;n++;}
  }
  if(n)setTimeout(sfx.whoosh,80);
  return n;
}
function check(){
  if(!present().length){win();return;}
  for(var c=0;c<rowLen(DANGER);c++)if(rows[DANGER][c]>=0){lose();return;}
}

/* ---------- drawing ---------- */
function ell(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);}
function bubble(x,y,c,s,face){
  s=s||1;var r=R*s-1;
  ctx.fillStyle=COLORS[c];ctx.strokeStyle=INK;ctx.lineWidth=3;ell(x,y,r,r);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.55)';ell(x-r*.35,y-r*.38,r*.3,r*.2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';ell(x+r*.4,y+r*.35,r*.12,r*.12);ctx.fill();
  if(face&&s>.8){
    ctx.fillStyle=INK;ell(x-r*.28,y-r*.02,r*.09,r*.12);ctx.fill();ell(x+r*.28,y-r*.02,r*.09,r*.12);ctx.fill();
    ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y+r*.18,r*.2,Math.PI*.15,Math.PI*.85);ctx.stroke();
  }
}
function draw(){
  var dpr=window.devicePixelRatio||1,r,c,i;
  ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5CC8F5');g.addColorStop(1,'#1F6FB2');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.08)';
  for(i=0;i<5;i++){ctx.beginPath();ctx.moveTo(60+i*120+Math.sin(clock*.5+i)*20,0);ctx.lineTo(20+i*120,H);ctx.lineTo(60+i*120,H);ctx.lineTo(100+i*120+Math.sin(clock*.5+i)*20,0);ctx.fill();}
  ctx.fillStyle='#F2D38A';ctx.beginPath();ctx.moveTo(0,H);ctx.quadraticCurveTo(W*.25,H-46,W*.5,H-30);ctx.quadraticCurveTo(W*.75,H-14,W,H-40);ctx.lineTo(W,H);ctx.fill();
  ctx.strokeStyle='#3DBE6C';ctx.lineWidth=6;ctx.lineCap='round';
  [[30,1],[70,.8],[W-50,1.1],[W-20,.7]].forEach(function(s,k){ctx.beginPath();ctx.moveTo(s[0],H-20);ctx.quadraticCurveTo(s[0]+Math.sin(clock*1.5+k)*12,H-20-60*s[1],s[0]+Math.sin(clock*1.2+k)*6,H-20-110*s[1]);ctx.stroke();});
  /* danger line */
  var dy=TOP+R+DANGER*RH-R;
  ctx.setLineDash([12,10]);ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,dy);ctx.lineTo(W,dy);ctx.stroke();ctx.setLineDash([]);
  /* stuck bubbles */
  for(r=0;r<rows.length;r++)for(c=0;c<rowLen(r);c++){if(rows[r][c]<0)continue;var p=cellXY(r,c);bubble(p.x,p.y+Math.sin(clock*2+r+c)*.8,rows[r][c],1,(r*7+c*3)%5===0);}
  /* aim guide: dotted line that bounces off the walls once */
  if(aim&&!shot&&playing){
    var ax=SX,ay=SY-26,vx=Math.cos(aim.angle),vy=Math.sin(aim.angle),bounced=0;
    ctx.fillStyle='rgba(255,255,255,.9)';
    for(i=0;i<70;i++){
      ax+=vx*14;ay+=vy*14;
      if(ax<R){ax=R;vx=-vx;bounced++;}if(ax>W-R){ax=W-R;vx=-vx;bounced++;}
      if(bounced>1||ay<TOP+R)break;
      var hit=false;
      for(r=0;r<rows.length&&!hit;r++)for(c=0;c<rowLen(r);c++){if(rows[r][c]>=0){var q=cellXY(r,c);if(Math.hypot(q.x-ax,q.y-ay)<D*.86){hit=true;break;}}}
      if(hit)break;
      if(i%2===0){ell(ax,ay,4,4);ctx.fill();}
    }
  }
  /* popping and falling bubbles */
  pops.forEach(function(p){if(p.t<0){bubble(p.x,p.y,p.c,1);return;}var s=1+p.t*4;ctx.globalAlpha=Math.max(0,1-p.t*4);ctx.strokeStyle=COLORS[p.c];ctx.lineWidth=4;ell(p.x,p.y,R*s,R*s);ctx.stroke();ctx.globalAlpha=1;});
  fallers.forEach(function(f){bubble(f.x,f.y,f.c,1,true);});
  if(shot)bubble(shot.x,shot.y,shot.c,1);
  whale();
  bits.forEach(function(q){ctx.globalAlpha=Math.min(1,q.life*2.5);ctx.fillStyle=q.col;ell(q.x,q.y,q.s,q.s);ctx.fill();});
  ctx.globalAlpha=1;
  /* warning count */
  var left=missLimit()-misses;
  ctx.fillStyle='rgba(29,53,87,.55)';ctx.beginPath();ctx.roundRect?ctx.roundRect(W-150,H-44,138,32,14):ctx.rect(W-150,H-44,138,32);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='600 16px Fredoka,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('Moves down in '+left,W-81,H-28);
}
/* Wally: an original little blue whale who blows the next bubble from its spout */
function whale(){
  var x=SX,y=SY,a=aim?aim.angle:-Math.PI/2,bob=Math.sin(clock*2)*2;
  ctx.save();ctx.translate(x,y+bob);
  ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.lineJoin='round';
  ctx.fillStyle='#4D8FE0';
  ctx.beginPath();ctx.moveTo(44,6);ctx.quadraticCurveTo(70,-4,72,-22);ctx.quadraticCurveTo(60,-6,52,-12);ctx.quadraticCurveTo(58,4,44,10);ctx.fill();ctx.stroke();
  ell(0,10,52,32);ctx.fill();ctx.stroke();
  ctx.fillStyle='#CFE8FF';ell(-4,22,36,16);ctx.fill();
  ctx.strokeStyle='rgba(29,53,87,.4)';ctx.lineWidth=2;for(var k=0;k<3;k++){ctx.beginPath();ctx.moveTo(-26+k*16,18);ctx.lineTo(-24+k*16,34);ctx.stroke();}
  ctx.strokeStyle=INK;ctx.lineWidth=3;
  ctx.fillStyle='#fff';ell(-22,0,9,10);ctx.fill();ctx.stroke();ell(12,0,9,10);ctx.fill();ctx.stroke();
  var lx=Math.cos(a)*3,ly=Math.sin(a)*3;ctx.fillStyle=INK;ell(-22+lx,1+ly,4.5,5);ctx.fill();ell(12+lx,1+ly,4.5,5);ctx.fill();
  ctx.fillStyle='rgba(255,120,160,.55)';ell(-34,12,6,4);ctx.fill();ell(24,12,6,4);ctx.fill();
  ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(-5,12,8,Math.PI*.15,Math.PI*.85);ctx.stroke();
  /* spout tube points where she aims */
  ctx.save();ctx.translate(0,-22);ctx.rotate(a+Math.PI/2);
  ctx.fillStyle='#3A78C8';ctx.lineWidth=3;ctx.beginPath();ctx.rect(-9,-26,18,26);ctx.fill();ctx.stroke();
  ctx.restore();
  ctx.restore();
  if(!shot)bubble(x+Math.cos(a)*30,y-22+Math.sin(a)*30+bob,cur,.92);
  /* next bubble, tap it to swap */
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='600 14px Fredoka,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('next',74,H-78);
  bubble(74,H-48,next,.75);
}
function resize(){
  var w=stage.clientWidth-14,h=stage.clientHeight-22;
  scale=Math.max(.2,Math.min(w/W,h/H));
  var dpr=window.devicePixelRatio||1;
  cv.style.width=Math.round(W*scale)+'px';cv.style.height=Math.round(H*scale)+'px';
  cv.width=Math.round(W*scale*dpr);cv.height=Math.round(H*scale*dpr);
  if(rows)draw();
}

/* ---------- aiming ---------- */
function pt(e){var r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale};}
function setAim(p){
  var a=Math.atan2(p.y-(SY-26),p.x-SX);
  /* never shoot down or almost flat */
  if(a>-.12&&a<Math.PI/2)a=-.12;if(a<-Math.PI+.12||a>=Math.PI/2)a=-Math.PI+.12;
  aim={angle:a,on:true};
}
cv.addEventListener('pointerdown',function(e){
  if(!playing)return;e.preventDefault();
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  var p=pt(e);
  if(Math.hypot(p.x-74,p.y-(H-48))<34){var t=cur;cur=next;next=t;sfx.swap();aim=aim||{angle:-Math.PI/2};aim.on=false;return;}
  setAim(p);
});
cv.addEventListener('pointermove',function(e){if(aim&&aim.on&&playing)setAim(pt(e));});
cv.addEventListener('pointerup',function(e){if(aim&&aim.on&&playing){setAim(pt(e));fire();aim.on=false;}});
cv.addEventListener('pointercancel',function(){if(aim)aim.on=false;});
document.addEventListener('keydown',function(e){
  if(!playing)return;aim=aim||{angle:-Math.PI/2};
  if(e.key==='ArrowLeft')aim.angle=Math.max(-Math.PI+.12,aim.angle-.06);
  else if(e.key==='ArrowRight')aim.angle=Math.min(-.12,aim.angle+.06);
  else if(e.key===' '||e.key==='ArrowUp')fire();
  else if(e.key==='s'){var t=cur;cur=next;next=t;}
  else return;
  e.preventDefault();
});
document.addEventListener('gesturestart',function(e){e.preventDefault();});

/* ---------- win and lose ---------- */
function starSvg(on){return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="'+(on?'#FFC400':'#E3ECF5')+'" stroke="#1D3557" stroke-width="1.6" stroke-linejoin="round"/></svg>';}
function win(){
  state='won';playing=false;sfx.win();
  var st=shots<=18?3:shots<=30?2:1;
  S.stars[S.level-1]=Math.max(S.stars[S.level-1]||0,st);S.best=Math.max(S.best,S.level);save();
  var lastLv=S.level===LEVELS.length;
  setTimeout(function(){
    $('cardTitle').textContent=lastLv?'You cleared the whole bay!':'All popped!';
    $('cardStars').innerHTML=starSvg(st>0)+starSvg(st>1)+starSvg(st>2);
    $('cardSub').textContent='You used '+shots+' bubbles.'+(lastLv?' Try more colors for a challenge!':'');
    $('playBtn').textContent=lastLv?'Play again':'Next level';$('playBtn').dataset.go=String(lastLv?1:S.level+1);
    showLevels();overlay.hidden=false;
  },700);
}
function lose(){
  state='lost';playing=false;sfx.oops();
  $('cardTitle').textContent='The bubbles reached the bottom!';$('cardStars').innerHTML='';
  $('cardSub').textContent='Try again! Tip: popping bubbles near the top drops everything hanging below.';
  $('playBtn').textContent='Try again';$('playBtn').dataset.go=String(S.level);
  showLevels();overlay.hidden=false;
}
function showLevels(){
  var h='';
  LEVELS.forEach(function(_,i){var n=i+1,open=n<=S.best+1,st=S.stars[i]||0;
    h+='<button class="sticker'+(n===S.level?' on':'')+'" data-n="'+n+'"'+(open?'':' disabled')+' aria-label="Level '+n+'">'+n+'<small>'+('★'.repeat(st)+'☆'.repeat(3-st))+'</small></button>';});
  $('levels').innerHTML=h;
  document.querySelectorAll('#levels button').forEach(function(b){b.addEventListener('click',function(){
    loadLevel(+b.dataset.n);state='ready';$('playBtn').dataset.go='';
    $('cardTitle').textContent='Level '+b.dataset.n;$('cardStars').innerHTML='';$('cardSub').textContent='Match 3 of the same color to pop them.';$('playBtn').textContent='Play';showLevels();
  });});
}

/* ---------- UI ---------- */
var toastTimer=null;
function toast(msg){toastEl.textContent=msg;toastEl.classList.remove('show');void toastEl.offsetWidth;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastEl.classList.remove('show');},1250);}
function showScore(){$('score').textContent=S.score;var b=$('scoreBox');b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');}
function syncOpts(){
  document.querySelectorAll('[data-col]').forEach(function(b){b.setAttribute('aria-pressed',String(+b.dataset.col===S.colors));});
  $('soundBtn').textContent=S.sound?'Sound on':'Sound off';$('soundBtn').setAttribute('aria-pressed',String(S.sound));
}
function save(){try{localStorage.setItem('bubbleBay',JSON.stringify({sound:S.sound,colors:S.colors,best:S.best,stars:S.stars}));}catch(e){}}
var ac=null;
function initAudio(){try{if(!ac){var AC=window.AudioContext||window.webkitAudioContext;if(AC)ac=new AC();}if(ac&&ac.state==='suspended')ac.resume();}catch(e){ac=null;}}
function tone(f,d,type,v,when,f2){
  if(!ac||!S.sound)return;
  try{var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+(when||0);o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
var sfx={
  shoot:function(){tone(300,.12,'sine',.1,0,700);},
  bounce:function(){tone(500,.04,'triangle',.05);},
  stick:function(){tone(260,.08,'triangle',.08);},
  pop:function(n){for(var i=0;i<Math.min(n,6);i++)tone(700+i*120,.06,'triangle',.09,i*.04,1300+i*100);},
  whoosh:function(){tone(900,.35,'sine',.08,0,200);},
  swap:function(){tone(600,.06,'triangle',.07);tone(800,.06,'triangle',.07,.05);},
  drop:function(){tone(220,.2,'square',.05,0,160);},
  oops:function(){tone(300,.35,'sine',.12,0,150);},
  win:function(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,.2,'triangle',.12,i*.1);});}
};
function play(){
  initAudio();
  var go=$('playBtn').dataset.go;
  if(go)loadLevel(+go);
  $('playBtn').dataset.go='';$('cardStars').innerHTML='';
  state='play';playing=true;overlay.hidden=true;last=performance.now();aim={angle:-Math.PI/2,on:false};
}
function pause(){
  if(!playing)return;playing=false;
  $('cardTitle').textContent='Taking a break';$('cardStars').innerHTML='';$('cardSub').textContent='Changing colors starts the level over.';
  $('playBtn').textContent='Keep going';$('playBtn').dataset.go='';showLevels();overlay.hidden=false;
}
$('playBtn').addEventListener('click',play);
$('pauseBtn').addEventListener('click',pause);
$('soundBtn').addEventListener('click',function(){S.sound=!S.sound;if(S.sound)initAudio();syncOpts();save();});
document.querySelectorAll('[data-col]').forEach(function(b){b.addEventListener('click',function(){
  if(S.colors===+b.dataset.col)return;S.colors=+b.dataset.col;syncOpts();save();loadLevel(S.level);$('playBtn').dataset.go='';$('playBtn').textContent='Play';
});});
document.addEventListener('visibilitychange',function(){if(document.hidden)pause();});

function frame(t){
  var dt=Math.min(1/30,(t-last)/1000);last=t;
  if(dt>0){
    clock+=dt;
    if(playing&&shot)stepShot(dt);
    pops.forEach(function(p){p.t+=dt;});pops=pops.filter(function(p){return p.t<.3;});
    fallers.forEach(function(f){f.vy+=1400*dt;f.y+=f.vy*dt;f.x+=f.vx*dt;if(f.y>H+R&&!f.done){f.done=true;if(!reduceMotion)for(var i=0;i<4;i++)bits.push({x:f.x,y:H-30,vx:(Math.random()-.5)*200,vy:-Math.random()*200-60,life:.6,col:'#FFFFFF',s:3});}});
    fallers=fallers.filter(function(f){return f.y<H+R*2;});
    bits.forEach(function(q){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=500*dt;q.life-=dt;});bits=bits.filter(function(q){return q.life>0;});
  }
  draw();requestAnimationFrame(frame);
}
try{var sv=JSON.parse(localStorage.getItem('bubbleBay')||'{}');if(typeof sv.sound==='boolean')S.sound=sv.sound;if([3,4,5].indexOf(sv.colors)>=0)S.colors=sv.colors;if(typeof sv.best==='number')S.best=Math.min(LEVELS.length,sv.best);if(Array.isArray(sv.stars))S.stars=sv.stars;}catch(e){}
S.level=Math.min(LEVELS.length,S.best+1);
loadLevel(S.level);syncOpts();showLevels();resize();
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
window.addEventListener('resize',resize);
last=performance.now();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
