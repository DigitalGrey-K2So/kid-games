<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" href="icon-192.png">

<style>
/* Layout idea: the sticker book's cover. One title and a grid of giant picture buttons, nothing else to tap. */
:root{
  --sun:#FFD84D;
  --sun-deep:#F7C52B;
  --ink:#231A5C;
  --paper:#FFFDF5;
  --font-display:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --font-body:'Nunito','Avenir Next','Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background-color:var(--sun);
  background-image:radial-gradient(var(--sun-deep) 18%,transparent 19%);
  background-size:44px 44px;
  color:var(--ink);font-family:var(--font-body);font-weight:700;
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
#app{height:100%;display:flex;flex-direction:column;gap:16px;padding:20px 16px 20px;max-width:1100px;margin:0 auto}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(34px,7vw,64px);line-height:1;margin:0;text-align:center;text-shadow:4px 4px 0 var(--paper);text-wrap:balance}
#grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:14px}
.game{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:0;
  text-decoration:none;color:var(--ink);font-family:var(--font-display);font-weight:600;font-size:clamp(20px,3.6vw,32px);
  border:5px solid var(--ink);border-radius:28px;box-shadow:0 7px 0 var(--ink);padding:10px;text-align:center;
}
.game:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.game:focus-visible{outline:5px solid #fff;outline-offset:4px}
.game svg{width:auto;height:62%;max-width:80%;flex:0 1 auto}
#g1{background:#B9A8FF}
#g2{background:#86DBA6}
#g3{background:#FFB8D9}
#g4{background:#FFC98F}
#g5{background:#9FD8FF}
#g6{background:#C9B6FF}
#g7{background:#A8E6B8}
#g8{background:#7FD3F5}
#g9{background:#B8E68A}
#g10{background:#FFD38A}
#g11{background:#2E5E2E;color:#CFFFCF}
#g12{background:#C3C3C3}
#g13{background:#FFE58A}
#g14{background:#9FE6E0}
#g15{background:#FFC4DA}
@media (orientation:landscape) and (min-width:700px){
  #grid{grid-template-columns:repeat(4,1fr)}
}
#back{align-self:center;display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:600;font-size:22px;color:var(--ink);background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:10px 22px;text-decoration:none}
#back:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#back svg{width:26px;height:26px}
#note{text-align:center;margin:0;font-size:17px}
#grid{grid-template-columns:repeat(2,minmax(0,300px));justify-content:center;grid-auto-rows:minmax(0,300px)}
@media (orientation:landscape) and (min-width:700px){#grid{grid-template-columns:repeat(3,minmax(0,300px))}}
#ptime{align-self:center;font-family:var(--font-display);font-weight:600;font-size:18px;color:var(--ink);background:#FFFDF5;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:8px 18px;text-decoration:none}
#ptime:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
</style>
</head>
<body>
<div id="app">
  <a id="back" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5L12 4l8.5 7.5" fill="none" stroke="#231A5C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9.5h4.5v-5h3v5H18V10" fill="none" stroke="#231A5C" stroke-width="2.6" stroke-linejoin="round"/></svg>Back to all games</a>

</div>
<script>

</html>
