<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gridville</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kid Games">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a 1990s desktop app window. Gray beveled panels, a tool palette on the left, the map in the middle, a status bar and news ticker underneath. */
:root{
  --desk:#2F6F6F;
  --panel:#C3C3C3;
  --hi:#FFFFFF;
  --lo:#6E6E6E;
  --ink:#111111;
  --title:#1B2B8F;
  --font-display:'Silkscreen','Courier New',monospace;
  --font-body:'IBM Plex Sans','Segoe UI',Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--font-body);font-size:14px;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
.bevel{background:var(--panel);border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi)}
.inset{border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
#win{position:absolute;inset:10px;display:flex;flex-direction:column}
#titlebar{background:linear-gradient(90deg,var(--title),#3A57D6);color:#fff;font-family:var(--font-display);font-size:14px;padding:5px 8px;display:flex;align-items:center;gap:10px}
#titlebar span:first-child{margin-right:auto}
#menubar{display:flex;flex-wrap:wrap;gap:4px;padding:4px 6px;align-items:center}
button{font-family:var(--font-body);font-size:14px;cursor:pointer;color:var(--ink)}
.btn{background:var(--panel);border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);padding:4px 10px;min-height:34px}
.btn:active,.btn[aria-pressed="true"]{border-color:var(--lo) var(--hi) var(--hi) var(--lo);background:#B0B0B0}
.btn:focus-visible{outline:2px dotted var(--ink);outline-offset:-5px}
#stats{display:flex;flex-wrap:wrap;gap:4px 14px;margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
#stats span b{font-weight:600;color:var(--title)}
#body{flex:1;min-height:0;display:flex;gap:6px;padding:0 6px 6px}
#tools{width:clamp(150px,17vw,190px);display:flex;flex-direction:column;gap:3px;padding:6px;overflow-y:auto}
#tools h3{font-family:var(--font-display);font-size:11px;margin:6px 0 2px;color:var(--lo)}
.tool{display:flex;align-items:center;gap:8px;text-align:left;width:100%}
.tool i{width:18px;height:18px;flex:0 0 18px;display:inline-block;border:1px solid var(--ink)}
.tool small{margin-left:auto;color:#333;font-variant-numeric:tabular-nums}
#demand{display:flex;gap:6px;justify-content:center;align-items:flex-end;height:74px;padding:4px;margin-top:6px;background:#E8E8E8}
#demand div{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--font-display);font-size:10px}
#demand .bar{width:18px;height:56px;position:relative;background:#FFF;border:1px solid var(--ink)}
#demand .bar span{position:absolute;left:0;right:0;bottom:50%}
#mapwrap{flex:1;min-width:0;min-height:0;position:relative;overflow:hidden;background:#1F4F8F}
#map{position:absolute;left:0;top:0;image-rendering:pixelated;touch-action:none}
#status{display:flex;gap:6px;padding:0 6px 6px}
#status > div{padding:4px 8px;min-height:28px;display:flex;align-items:center}
#hover{width:clamp(180px,26vw,320px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#news{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.35);z-index:5}
#modal[hidden]{display:none}
#dlg{width:min(520px,94vw);max-height:90vh;overflow:auto}
#dlg .t{background:linear-gradient(90deg,var(--title),#3A57D6);color:#fff;font-family:var(--font-display);padding:5px 8px;font-size:13px}
#dlgBody{padding:14px 16px;line-height:1.45}
#dlgBody h2{font-family:var(--font-display);font-size:18px;margin:0 0 8px;color:var(--title)}
#dlgBody table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin:6px 0}
#dlgBody td{padding:3px 4px;border-bottom:1px solid #A0A0A0}
#dlgBody td:last-child{text-align:right}
#dlgBtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:0 16px 14px}
input[type=range]{width:100%}
@media (max-width:700px){#tools{width:128px}.tool small{display:none}}
</style>
</head>
<body>
<div id="win" class="bevel">
  <div id="titlebar"><span>GRIDVILLE</span><span id="cityName">Untitled</span></div>
  <div id="menubar">
    <a class="btn" id="homeBtn" href="level2.html" aria-label="Home: back to all games" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;background:#FFE066;color:#111;font-weight:600;font-size:16px;min-height:38px;padding:4px 14px"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3.5 11.5L12 4l8.5 7.5" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9.5h4.5v-5h3v5H18V10" fill="none" stroke="#111111" stroke-width="2.6" stroke-linejoin="round"/></svg>Home</a>
    <button class="btn" id="budgetBtn">Budget</button>
    <button class="btn" id="overlayBtn" aria-pressed="false">Map: City</button>
    <button class="btn" data-spd="0" aria-pressed="false">Pause</button>
    <button class="btn" data-spd="1" aria-pressed="true">Slow</button>
    <button class="btn" data-spd="2" aria-pressed="false">Fast</button>
    <button class="btn" id="zoomIn" aria-label="Zoom in">+</button>
    <button class="btn" id="zoomOut" aria-label="Zoom out">&minus;</button>
    <button class="btn" id="fileBtn">File</button>
    <div id="stats"><span>Date <b id="date">Jan 1900</b></span><span>Funds <b id="funds">$0</b></span><span>Pop <b id="pop">0</b></span></div>
  </div>
  <div id="body">
    <div id="tools" class="bevel inset"></div>
    <div id="mapwrap" class="inset"><canvas id="map" aria-label="City map"></canvas></div>
  </div>
  <div id="status"><div id="hover" class="bevel inset">Drag to build. Hold the Hand tool to scroll.</div><div id="news" class="bevel inset">Welcome, Mayor.</div></div>
</div>
<div id="modal" hidden><div id="dlg" class="bevel"><div class="t" id="dlgTitle">Gridville</div><div id="dlgBody"></div><div id="dlgBtns"></div></div></div>
<script>
(function(){
'use strict';
var N=64; /* map is N by N tiles */
var TOOLS=[
  {id:'hand',name:'Hand',cost:0,col:'#F4E1B0',grp:'View'},
  {id:'query',name:'Inspect',cost:0,col:'#FFFFFF',grp:'View'},
  {id:'bulldoze',name:'Bulldoze',cost:1,col:'#C89B5A',grp:'Build'},
  {id:'road',name:'Road',cost:10,col:'#555555',grp:'Build'},
  {id:'wire',name:'Power line',cost:5,col:'#E6C229',grp:'Build'},
  {id:'res',name:'Residential',cost:100,col:'#4CB050',grp:'Zones',sz:3},
  {id:'com',name:'Commercial',cost:100,col:'#3F7FE0',grp:'Zones',sz:3},
  {id:'ind',name:'Industrial',cost:100,col:'#E0B020',grp:'Zones',sz:3},
  {id:'park',name:'Park',cost:20,col:'#2E8B3A',grp:'Services'},
  {id:'police',name:'Police',cost:500,col:'#2B3F9E',grp:'Services',sz:3},
  {id:'fire',name:'Fire station',cost:500,col:'#C83A2B',grp:'Services',sz:3},
  {id:'coal',name:'Coal plant',cost:3000,col:'#5A4A3A',grp:'Power',sz:4},
  {id:'wind',name:'Wind farm',cost:1500,col:'#BFE6FF',grp:'Power',sz:2}
];
var TB={};TOOLS.forEach(function(t){TB[t.id]=t;});
var PLANT={coal:{power:240,poll:30},wind:{power:70,poll:0}};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function $(id){return document.getElementById(id);}
var cv=$('map'),ctx=cv.getContext('2d'),wrap=$('mapwrap');

/* ---------- city data ----------
   t: terrain 0 land, 1 water, 2 trees
   b: what is built: '' | road | wire | park | zone/building piece
   each building piece points to its root tile, which holds type, level and state */
var C;
function newCity(seed){
  C={name:'Gridville',funds:20000,month:0,year:1900,tax:7,fundRoad:100,fundPolice:100,fundFire:100,tiles:[],history:[],totalPop:0,rDem:.6,cDem:.3,iDem:.6,lastBudget:null};
  var r=rng(seed||Math.floor(Math.random()*1e9));
  var hx=r()*N,hy=r()*N,ang=r()*Math.PI;
  for(var y=0;y<N;y++)for(var x=0;x<N;x++){
    var nz=noise(x,y,r.seed),t=0;
    /* a river crossing the map plus a lake, then forests */
    var d=Math.abs((x-hx)*Math.sin(ang)-(y-hy)*Math.cos(ang));
    var wig=Math.sin((x+y)*.15+r.seed)*2.5;
    if(d+wig<2.2)t=1;
    else if(nz>.72)t=1;
    else if(nz>.56)t=2;
    C.tiles.push({t:t,b:'',root:-1});
  }
  C.history=[];
}
function rng(seed){var a=seed>>>0;var f=function(){a=(a+0x6D2B79F5)>>>0;var t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};f.seed=seed%1000;return f;}
function noise(x,y,s){var v=0,a=1,f=.06,tot=0;for(var o=0;o<3;o++){v+=a*(Math.sin(x*f+s)*Math.cos(y*f*1.3+s*2)+Math.sin((x+y)*f*.7+s*3))*.25+a*.5;tot+=a;a*=.5;f*=2.1;}return v/tot;}
function T(x,y){return C.tiles[y*N+x];}
function inMap(x,y){return x>=0&&y>=0&&x<N&&y<N;}
function rootOf(x,y){var t=T(x,y);return t.root>=0?C.tiles[t.root]:t;}

/* ---------- building ---------- */
function canPlace(x,y,sz){
  for(var j=0;j<sz;j++)for(var i=0;i<sz;i++){if(!inMap(x+i,y+j))return false;var t=T(x+i,y+j);if(t.t===1||t.b)return false;}
  return true;
}
function place(tool,x,y){
  var tb=TB[tool],sz=tb.sz||1;
  if(tool==='hand'||tool==='query')return false;
  if(tool==='bulldoze'){
    if(!inMap(x,y))return false;var t=T(x,y);
    if(!t.b&&t.t===2){if(C.funds<1)return false;t.t=0;C.funds-=1;return true;}
    if(!t.b)return false;
    var ri=t.root>=0?t.root:y*N+x,r=C.tiles[ri],rs=r.sz||1,rx=ri%N,ry=Math.floor(ri/N);
    var cost=rs>1?rs*rs:1;if(C.funds<cost)return false;C.funds-=cost;
    for(var j=0;j<rs;j++)for(var i=0;i<rs;i++){var q=T(rx+i,ry+j);q.b='';q.root=-1;q.lv=0;q.sz=0;q.fire=0;q.pop=0;}
    return true;
  }
  /* roads and power lines can cross water as bridges, and each other */
  if(tool==='road'||tool==='wire'){
    if(!inMap(x,y))return false;var tt=T(x,y);
    if(tt.b&&!((tt.b==='road'&&tool==='wire')||(tt.b==='wire'&&tool==='road')))return false;
    var c=tb.cost*(tt.t===1?5:1);if(C.funds<c)return false;
    if(tt.b){tt.b='roadwire';}else tt.b=tool;
    tt.t=tt.t===2?0:tt.t;C.funds-=c;return true;
  }
  if(!canPlace(x,y,sz)||C.funds<tb.cost)return false;
  C.funds-=tb.cost;
  var rootI=y*N+x;
  for(var jj=0;jj<sz;jj++)for(var ii=0;ii<sz;ii++){var p=T(x+ii,y+jj);p.t=0;p.b=tool;p.root=(ii||jj)?rootI:-1;}
  var root=C.tiles[rootI];root.sz=sz;root.lv=0;root.pop=0;root.age=0;
  return true;
}
function isRoad(x,y){if(!inMap(x,y))return false;var b=T(x,y).b;return b==='road'||b==='roadwire';}

/* ---------- the simulation: one month at a time ---------- */
var powered=new Uint8Array(N*N),poll=new Float32Array(N*N),crime=new Float32Array(N*N),fireCov=new Float32Array(N*N),polCov=new Float32Array(N*N),landVal=new Float32Array(N*N);
var supply=0,demandPower=0;
function eachRoot(fn){for(var i=0;i<N*N;i++){var t=C.tiles[i];if(t.b&&t.root<0&&t.sz)fn(t,i%N,Math.floor(i/N),i);}}
function conductor(t){return t.b&&t.b!=='road'&&t.b!=='park';}
function powerGrid(){
  powered.fill(0);supply=0;demandPower=0;
  var q=[];
  eachRoot(function(t,x,y){
    if(PLANT[t.b]){supply+=PLANT[t.b].power;for(var j=0;j<t.sz;j++)for(var i=0;i<t.sz;i++){var k=(y+j)*N+x+i;powered[k]=1;q.push(k);}}
    else if(t.b==='res'||t.b==='com'||t.b==='ind'||t.b==='police'||t.b==='fire')demandPower+=t.b==='res'||t.b==='com'||t.b==='ind'?Math.max(1,t.lv)*2:4;
  });
  /* flood through power lines and anything built that touches */
  while(q.length){
    var k=q.pop(),x=k%N,y=(k-x)/N;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
      var nx=x+d[0],ny=y+d[1];if(!inMap(nx,ny))return;var nk=ny*N+nx;if(powered[nk])return;
      if(conductor(C.tiles[nk])){powered[nk]=1;q.push(nk);}
    });
  }
  /* not enough plants: the far end of town browns out */
  if(demandPower>supply&&supply>=0){
    var ratio=supply/Math.max(1,demandPower),n=0;
    eachRoot(function(t,x,y,i){if(powered[i]&&(t.b==='res'||t.b==='com'||t.b==='ind')){n++;if(((x*31+y*17)%100)/100>ratio){for(var j=0;j<t.sz;j++)for(var ii=0;ii<t.sz;ii++)powered[(y+j)*N+x+ii]=0;}}});
  }
}
function spread(arr,cx,cy,r,amt){
  for(var y=Math.max(0,cy-r);y<Math.min(N,cy+r+1);y++)for(var x=Math.max(0,cx-r);x<Math.min(N,cx+r+1);x++){
    var d=Math.abs(x-cx)+Math.abs(y-cy);if(d<=r)arr[y*N+x]+=amt*(1-d/(r+1));
  }
}
function maps(){
  poll.fill(0);crime.fill(0);fireCov.fill(0);polCov.fill(0);landVal.fill(0);
  var roadTiles=0;
  for(var i=0;i<N*N;i++){var t=C.tiles[i],x=i%N,y=(i-x)/N;
    if(t.b==='road'||t.b==='roadwire'){roadTiles++;poll[i]+=.4;}
    if(t.t===1)landVal[i]+=0;
  }
  eachRoot(function(t,x,y){
    var cx=x+Math.floor(t.sz/2),cy=y+Math.floor(t.sz/2);
    if(t.b==='ind')spread(poll,cx,cy,6,2+t.lv*2.5);
    if(t.b==='coal')spread(poll,cx,cy,9,PLANT.coal.poll/3);
    if(t.b==='com')spread(poll,cx,cy,3,t.lv*.8);
    if(t.b==='police')spread(polCov,cx,cy,12,C.fundPolice/100*14);
    if(t.b==='fire')spread(fireCov,cx,cy,12,C.fundFire/100*14);
    if(t.b==='park')spread(landVal,cx,cy,4,3);
    if(t.b==='res'||t.b==='com')spread(crime,cx,cy,4,t.lv*1.4);
  });
  for(var k=0;k<N*N;k++){
    var tt=C.tiles[k],kx=k%N,ky=(k-kx)/N;
    if(tt.t===1)spread(landVal,kx,ky,2,.25);
    if(tt.t===2)landVal[k]+=.6;
    crime[k]=Math.max(0,crime[k]-polCov[k]*.8);
  }
  return roadTiles;
}
function roadNear(t,x,y){
  for(var j=-1;j<=t.sz;j++)for(var i=-1;i<=t.sz;i++){if((i<0||j<0||i>=t.sz||j>=t.sz)&&isRoad(x+i,y+j))return true;}
  return false;
}
var CAP={res:[0,16,48,120,240],com:[0,8,24,60,120],ind:[0,10,30,70,140]};
function month(){
  powerGrid();var roads=maps();
  var R=0,Cj=0,Ij=0;
  eachRoot(function(t){if(t.b==='res')R+=t.pop;if(t.b==='com')Cj+=t.pop;if(t.b==='ind')Ij+=t.pop;});
  var jobs=Cj+Ij,taxF=(9-C.tax)*.06;
  /* demand: people follow jobs, shops follow people, factories follow the outside world */
  var target={
    r:clamp(((jobs*1.25+60)-R)/(R+60)+taxF,-1,1),
    c:clamp((R*.3-Cj)/(Cj+30)+taxF,-1,1),
    i:clamp(((R*.45+40)-Ij)/(Ij+50)+taxF+(C.year<1950?.15:0),-1,1)
  };
  C.rDem+=(target.r-C.rDem)*.3;C.cDem+=(target.c-C.cDem)*.3;C.iDem+=(target.i-C.iDem)*.3;
  var news=[];
  eachRoot(function(t,x,y,i){
    if(t.b!=='res'&&t.b!=='com'&&t.b!=='ind'){return;}
    t.age=(t.age||0)+1;
    var cx=x+1,cy=y+1,ci=cy*N+cx;
    var hasPow=powered[i],hasRoad=roadNear(t,x,y);
    var dem=t.b==='res'?C.rDem:t.b==='com'?C.cDem:C.iDem;
    var score=dem;
    if(t.b==='res')score+=landVal[ci]*.08-poll[ci]*.05-crime[ci]*.04;
    if(t.b==='com')score+=landVal[ci]*.04-crime[ci]*.05+Math.min(.3,R/2000);
    if(t.b==='ind')score-=crime[ci]*.02;
    if(fireCov[ci]<1)score-=.05;
    if(!hasPow||!hasRoad)score=-1;
    t.noPow=!hasPow;t.noRoad=!hasRoad;
    var r=Math.random();
    if(score>.08&&t.lv<4&&r<.25+score*.3)t.lv++;
    else if(score<-.25&&t.lv>0&&r<.2)t.lv--;
    var cap=CAP[t.b][t.lv];t.pop+=Math.round((cap-t.pop)*.35);
    /* fires break out in places without a fire station nearby */
    if(t.lv>0&&Math.random()<.0009*(1-Math.min(1,fireCov[ci]/5))*(C.fundFire<60?2:1)){t.lv=0;t.pop=0;t.burnt=6;news.push('A fire broke out near '+(x+1)+','+(y+1)+'. Build fire stations to protect the city.');}
    if(t.burnt)t.burnt--;
  });
  var pop=0;eachRoot(function(t){if(t.b==='res')pop+=t.pop;});C.totalPop=pop;
  C.month++;
  if(C.month>11){C.month=0;C.year++;yearEnd(roads);}
  if(C.history.length>=120)C.history.shift();
  C.history.push(pop);
  /* the news ticker */
  if(supply===0&&demandPower>0)news.push('No power! Build a power plant and connect it with power lines.');
  else if(demandPower>supply)news.push('Brownouts! The city needs more power.');
  else if(C.rDem>.5)news.push('People want to move here. Zone more residential.');
  else if(C.cDem>.5)news.push('Residents want places to shop. Zone commercial.');
  else if(C.iDem>.5)news.push('Factories are looking for land. Zone industrial.');
  else if(avg(crime)>1.5)news.push('Crime is rising. Residents want police stations.');
  else if(avg(poll)>2)news.push('Smog is thick downtown. Try parks, or wind power.');
  if(news.length)setNews(news[0]);
  milestone(pop);
  save();
}
function avg(a){var s=0,n=0;eachRoot(function(t,x,y,i){if(t.b==='res'){s+=a[i];n++;}});return n?s/n:0;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
var MILES=[[500,'Gridville is now a village!'],[2000,'Gridville is now a town!'],[10000,'Gridville is now a city!'],[50000,'Gridville is now a capital!'],[100000,'Gridville is a metropolis!']];
function milestone(pop){
  C.mile=C.mile||0;
  if(C.mile<MILES.length&&pop>=MILES[C.mile][0]){dialog('Milestone','<h2>'+MILES[C.mile][1]+'</h2><p>Population '+pop.toLocaleString()+'. The residents are throwing a parade.</p>',[['Wonderful',close]]);C.mile++;}
}
function yearEnd(roads){
  var R=0,Cj=0,Ij=0,pol=0,fir=0;
  eachRoot(function(t){if(t.b==='res')R+=t.pop;if(t.b==='com')Cj+=t.pop;if(t.b==='ind')Ij+=t.pop;if(t.b==='police')pol++;if(t.b==='fire')fir++;});
  var income=Math.round((R*1.6+Cj*2.2+Ij*2)*C.tax/7);
  var eRoad=Math.round(roads*1*C.fundRoad/100),ePol=Math.round(pol*100*C.fundPolice/100),eFire=Math.round(fir*100*C.fundFire/100);
  C.funds+=income-eRoad-ePol-eFire;
  C.lastBudget={year:C.year-1,income:income,road:eRoad,police:ePol,fire:eFire};
  if(C.fundRoad<70){eachRoot(function(){});} /* roads decay slowly when underfunded: kept simple */
  setNews('Year '+(C.year-1)+' taxes: +$'+income.toLocaleString()+'. Costs: $'+(eRoad+ePol+eFire).toLocaleString()+'.');
  if(C.funds<0)setNews('The city is in debt! Raise taxes or cut costs.');
}

/* ---------- drawing ---------- */

  for(y=y0;y<y1;y++)for(x=x0;x<x1;x++){
    t=T(x,y);var sx=x*ts-camX,sy=y*ts-camY;
    if(t.t===1){ctx.fillStyle=((x+y+Math.floor(frameT/30))%7===0)?'#3B78C4':'#2E66B0';ctx.fillRect(sx,sy,ts,ts);}

function drawSmall(t,x,y){

  if(t.b==='road'||t.b==='roadwire'){
    ctx.fillStyle=t.t===1?'#8A7A6A':'#5A5A5A';ctx.fillRect(sx,sy,ts,ts);
    var n=isRoad(x,y-1),s=isRoad(x,y+1),w=isRoad(x-1,y),e=isRoad(x+1,y);

}
function drawBuilding(r,x,y){
  var sx=x*ts-camX,sy=y*ts-camY,S=r.sz*ts,tb=TB[r.b];
  if(r.b==='res'||r.b==='com'||r.b==='ind'){

    ctx.fillStyle='#7A6A5A';ctx.fillRect(sx+S*.1,sy+S*.45,S*.8,S*.45);
    ctx.fillStyle='#444';ctx.fillRect(sx+S*.2,sy+S*.1,S*.12,S*.4);ctx.fillRect(sx+S*.6,sy+S*.15,S*.12,S*.35);
    ctx.fillStyle='rgba(200,200,200,.6)';var o=(frameT/4)%10;ctx.beginPath();ctx.arc(sx+S*.26+o*.4,sy+S*.06-o*.3,S*.07+o*.2,0,7);ctx.fill();

      var a=frameT*.08+k;ctx.strokeStyle='#FFF';for(var b=0;b<3;b++){ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a+b*2.09)*S*.2,cy+Math.sin(a+b*2.09)*S*.2);ctx.stroke();}}

/* little rooftops: more and taller as a zone grows */
function drawBlocks(r,sx,sy,S){

function tilePt(e){var r=cv.getBoundingClientRect();return {x:Math.floor((e.clientX-r.left+camX)/ts),y:Math.floor((e.clientY-r.top+camY)/ts),px:e.clientX,py:e.clientY};}

var pointers={},pinch=null;

  var ids=Object.keys(pointers);
  if(ids.length===2){drag=null;var a=pointers[ids[0]],b=pointers[ids[1]];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),ts:ts,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,camX:camX,camY:camY};return;}
  var p=tilePt(e);hover=p;

  if(tool==='hand'||e.button===1||e.button===2){drag={pan:true,sx:e.clientX,sy:e.clientY,cx:camX,cy:camY};return;}
  if(tool==='query'){inspect(p.x,p.y);return;}
  if(tool==='road'||tool==='wire'||tool==='bulldoze'||tool==='park'){drag={start:p,line:[[p.x,p.y]]};}

});
cv.addEventListener('pointermove',function(e){
  if(pointers[e.pointerId]){pointers[e.pointerId]={x:e.clientX,y:e.clientY};}
  if(pinch){
    var ids=Object.keys(pointers);if(ids.length<2)return;var a=pointers[ids[0]],b=pointers[ids[1]];
    var nd=Math.hypot(a.x-b.x,a.y-b.y);setZoom(pinch.ts*nd/pinch.d,pinch.cx,pinch.cy);return;
  }
  var p=tilePt(e);hover=p;showHover(p.x,p.y);

function rect(a,b){var out=[];for(var y=Math.min(a.y,b.y);y<=Math.max(a.y,b.y);y++)for(var x=Math.min(a.x,b.x);x<=Math.max(a.x,b.x);x++)out.push([x,y]);return out;}

function fileMenu(){
  dialog('File','<h2>'+C.name+'</h2><p><label for="nm">City name</label><br><input id="nm" maxlength="20" value="'+C.name.replace(/"/g,'')+'" style="font:inherit;padding:4px;width:100%"></p><p>Your city saves itself every month in this browser.</p>',[
    ['Save name',function(){C.name=($('nm').value.trim()||'Gridville');refresh();save();close();}],
    ['New city',function(){dialog('New city','<p>Start over on a new map? Your current city will be lost.</p>',[['Yes, new map',function(){newCity();centerCam();save();refresh();close();help();}],['Cancel',close]]);}],
    ['How to play',help],['Close',close]
  ]);
}
function help(){
  dialog('How to play','<h2>Welcome, Mayor</h2><ol style="padding-left:18px;margin:0">'+
    '<li>Build a <b>Coal plant</b> or <b>Wind farm</b>.</li>'+
    '<li>Lay <b>Roads</b> by dragging across the map.</li>'+
    '<li>Place <b>Residential</b>, <b>Commercial</b> and <b>Industrial</b> zones along the roads.</li>'+
    '<li>Connect zones to the power plant. Zones that touch pass power along; use <b>Power lines</b> to bridge gaps.</li>'+
    '<li>Watch the <b>Demand</b> bars to see what the city wants next.</li>'+
    '<li>Add police, fire stations and parks as the city grows. Set taxes in <b>Budget</b>.</li></ol>'+
    '<p>Drag with the Hand tool, or with two fingers, to move around. Pinch or use + and &minus; to zoom.</p>',[['Start building',close]]);
}

/* ---------- time ---------- */
var speed=1,acc=0,frameT=0,last=performance.now();
var SPEEDS=[0,2.2,.6];
function setSpeed(s,quiet){if(!quiet)resumeSpeed=s;speed=s;document.querySelectorAll('[data-spd]').forEach(function(b){b.setAttribute('aria-pressed',String(+b.dataset.spd===s));});}
document.querySelectorAll('[data-spd]').forEach(function(b){b.addEventListener('click',function(){setSpeed(+b.dataset.spd);sfx.click();});});
$('budgetBtn').addEventListener('click',budget);
$('fileBtn').addEventListener('click',fileMenu);
$('overlayBtn').addEventListener('click',function(){overlay=OVERLAYS[(OVERLAYS.indexOf(overlay)+1)%OVERLAYS.length];this.textContent='Map: '+overlay.replace(/^./,function(c){return c.toUpperCase();});this.setAttribute('aria-pressed',String(overlay!=='city'));powerGrid();maps();});
$('zoomIn').addEventListener('click',function(){var r=cv.getBoundingClientRect();setZoom(ts*1.25,r.left+r.width/2,r.top+r.height/2);});
$('zoomOut').addEventListener('click',function(){var r=cv.getBoundingClientRect();setZoom(ts/1.25,r.left+r.width/2,r.top+r.height/2);});
document.addEventListener('visibilitychange',function(){if(document.hidden)save();});
window.addEventListener('pagehide',save);
function frame(t){
  var dt=Math.min(.1,(t-last)/1000);last=t;frameT++;
  if(speed&&$('modal').hidden){acc+=dt;if(acc>=SPEEDS[speed]){acc=0;month();refresh();}}
  draw();requestAnimationFrame(frame);
}

/* ---------- saving ---------- */
function save(){
  try{
    var tiles=C.tiles.map(function(t){return t.root>=0?[t.t,t.b,t.root]:[t.t,t.b,-1,t.sz||0,t.lv||0,t.pop||0];});
    var c={};for(var k in C)if(k!=='tiles')c[k]=C[k];c.tiles=tiles;
    localStorage.setItem('gridville',JSON.stringify(c));
  }catch(e){}
}
function load(){
  try{
    var s=JSON.parse(localStorage.getItem('gridville')||'null');if(!s||!Array.isArray(s.tiles)||s.tiles.length!==N*N)return false;
    C=s;C.tiles=s.tiles.map(function(a){var t={t:a[0],b:a[1],root:a[2]};if(a[2]<0){t.sz=a[3];t.lv=a[4];t.pop=a[5];}return t;});
    return true;
  }catch(e){return false;}
}
var ac=null;
function initAudio(){try{if(!ac){var AC=window.AudioContext||window.webkitAudioContext;if(AC)ac=new AC();}if(ac&&ac.state==='suspended')ac.resume();}catch(e){ac=null;}}
function tone(f,d,v){if(!ac)return;try{var o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(v||.03,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
var sfx={build:function(){tone(220,.05);tone(330,.05);},click:function(){tone(880,.02,.02);},nope:function(){tone(120,.12);}};
function centerCam(){var W=wrap.clientWidth,H=wrap.clientHeight;ts=Math.max(10,Math.min(18,Math.floor(Math.min(W,H)/36)));camX=N*ts/2-W/2;camY=N*ts/2-H/2;clampCam();}

var fresh=!load();
if(fresh)newCity();
buildTools();centerCam();powerGrid();maps();refresh();
window.addEventListener('resize',clampCam);
requestAnimationFrame(frame);
if(fresh)help();else setNews('Welcome back to '+C.name+', Mayor.');
})();
</script>
</body>
</html>
