<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mango Dash</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kid Games">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: sticker book, trail runner edition. One big window looking down a three lane jungle path. */
:root{
  --page:#86DBA6;
  --page-dot:#74CF97;
  --ink:#143A2E;
  --paper:#FFFBEA;
  --go:#FFD84D;
  --font-display:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --font-body:'Nunito','Avenir Next','Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background-color:var(--page);
  background-image:radial-gradient(var(--page-dot) 18%,transparent 19%);
  background-size:44px 44px;
  color:var(--ink);font-family:var(--font-body);font-weight:700;
  overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding:12px 16px 16px}
.sticker{font-family:var(--font-display);font-weight:600;color:var(--ink);background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink)}
button{cursor:pointer;font:inherit;color:inherit}
button.sticker:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}
#info{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,5vw,40px);line-height:1;margin:0;margin-right:auto;letter-spacing:.5px;text-shadow:3px 3px 0 var(--paper)}
.stat{display:flex;align-items:center;gap:8px;padding:4px 16px 4px 12px;font-size:26px;font-variant-numeric:tabular-nums;min-height:56px}
.stat svg{width:30px;height:30px}
.stat small{font-size:16px;font-family:var(--font-body);font-weight:800}
#fruitBox.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.2) rotate(-5deg)}}
a.mini{text-decoration:none}
a.mini:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.mini{min-height:54px;min-width:54px;padding:0 12px;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.mini svg{width:24px;height:24px}
#stage{flex:1;min-height:0;position:relative}
#view{position:absolute;inset:0 0 6px;width:100%;height:calc(100% - 6px);border:6px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);background:#BDEBFF;touch-action:none}
#overlay{position:absolute;inset:0;display:grid;place-items:center;z-index:3}
#overlay[hidden]{display:none}
#card{padding:20px 28px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:min(96%,540px);max-height:98%;overflow:auto}
#card h2{font-family:var(--font-display);font-weight:700;font-size:34px;margin:0;text-wrap:balance}
#cardSub{margin:0;font-size:18px}
#cardSub:empty{display:none}
#how{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;text-align:left;font-size:17px;margin:0}
#how dt{font-family:var(--font-display);font-weight:700}
#how dd{margin:0}
#playBtn{background:var(--go);font-size:30px;padding:12px 38px;min-height:74px;border-radius:26px}
#opts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:4px}
.seg{display:flex;overflow:hidden;padding:0}
.seg button{border:0;background:transparent;padding:0 12px;min-height:46px;font-family:var(--font-display);font-weight:600;font-size:16px;display:flex;align-items:center;gap:5px}
.seg button + button{border-left:3px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg .emo{font-size:20px}
#toast{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%) scale(0);z-index:2;pointer-events:none;padding:8px 22px;font-size:clamp(24px,5vw,36px);white-space:nowrap;background:var(--go)}
#toast.show{animation:pop 1.1s both}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0) rotate(-8deg)}18%{transform:translate(-50%,-50%) scale(1.1) rotate(3deg)}28%,78%{transform:translate(-50%,-50%) scale(1) rotate(-2deg);opacity:1}100%{transform:translate(-50%,-50%) scale(.9);opacity:0}}
@media (prefers-reduced-motion:reduce){#toast.show{animation:none;transform:translate(-50%,-50%) scale(1)}#fruitBox.bump{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header id="info">
    <h1>Mango Dash</h1>
    <div id="fruitBox" class="sticker stat" aria-live="polite" aria-label="Fruit collected">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="14" r="8" fill="#FF9F1C" stroke="#143A2E" stroke-width="2"/><path d="M12 6c1-3 4-4 6-3-1 3-3 4-6 3z" fill="#3DBE6C" stroke="#143A2E" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span id="fruit">0</span>
    </div>
    <div class="sticker stat"><small>Meters</small><span id="dist">0</span></div>
    <a id="homeBtn" href="index.html" class="sticker mini" aria-label="Back to all games">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5L12 4l8.5 7.5" fill="none" stroke="#143A2E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9.5h4.5v-5h3v5H18V10" fill="none" stroke="#143A2E" stroke-width="2.6" stroke-linejoin="round"/></svg>
    </a>
    <button id="pauseBtn" class="sticker mini" aria-label="Pause">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5" fill="#143A2E"/><rect x="14" y="4" width="5" height="16" rx="1.5" fill="#143A2E"/></svg>
    </button>
  </header>
  <main id="stage">
    <canvas id="view" aria-label="Jungle path"></canvas>
    <div id="toast" class="sticker" aria-hidden="true"></div>
    <div id="overlay">
      <div id="card" class="sticker">
        <h2 id="cardTitle">Run, Mango, run!</h2>
        <dl id="how">
          <dt>Swipe left or right</dt><dd>change lanes around bushes</dd>
          <dt>Swipe up or tap</dt><dd>jump over logs</dd>
          <dt>Swipe down</dt><dd>slide under branches</dd>
        </dl>
        <p id="cardSub"></p>
        <button id="playBtn" class="sticker">Play</button>
        <div id="opts">
          <div class="seg sticker" role="group" aria-label="Speed">
            <button data-speed="turtle" aria-pressed="true"><span class="emo">🐢</span>Slow</button>
            <button data-speed="bunny" aria-pressed="false"><span class="emo">🐇</span>Medium</button>
            <button data-speed="cheetah" aria-pressed="false"><span class="emo">🐆</span>Fast</button>
          </div>
          <button id="soundBtn" class="sticker mini" aria-pressed="true">Sound on</button>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
(function(){
'use strict';
var INK='#143A2E',FAR=55,CAM=4.2,GAP={turtle:15,bunny:13,cheetah:11};
var SPEED={turtle:7,bunny:10,cheetah:13};
function $(id){return document.getElementById(id);}
var cv=$('view'),ctx=cv.getContext('2d'),overlay=$('overlay'),toastEl=$('toast');
var reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var S={speed:'turtle',sound:true,fruit:0,best:0};
var P,things,dist,nextRow,slow,playing=false,Wd=600,Ht=400,clock=0,last=0,particles=[],milestone=0;

function reset(){
  P={lane:0,x:0,y:0,vy:0,slide:0,inv:0,step:0};
  things=[];dist=0;nextRow=14;slow=1;milestone=0;particles=[];
  /* a fruit trail to start so the first thing she sees is something to grab */
  for(var i=0;i<5;i++)things.push({kind:'fruit',lane:0,z:6+i*2,y:.35,c:i%3});
}
/* rows of trouble, always with at least one clear lane and some fruit to aim for */
function spawnRow(z){
  var r=Math.random(),lanes=[-1,0,1].sort(function(){return Math.random()-.5;});
  var level=Math.min(1,dist/400),blocked=[];
  if(r<.45){
    blocked=[lanes[0]];
    things.push({kind:'bush',lane:lanes[0],z:z});
    if(Math.random()<.35+level*.3){blocked.push(lanes[1]);things.push({kind:'bush',lane:lanes[1],z:z});}
  }else if(r<.75){
    things.push({kind:'log',lane:lanes[0],z:z});blocked=[lanes[0]];
    for(var k=0;k<3;k++)things.push({kind:'fruit',lane:lanes[0],z:z-1+k,y:[.6,1.1,.6][k],c:1});
    if(Math.random()<level*.5){things.push({kind:'log',lane:lanes[1],z:z});blocked.push(lanes[1]);}
  }else{
    things.push({kind:'branch',lane:lanes[0],z:z});blocked=[lanes[0]];
  }
  var open=[-1,0,1].filter(function(l){return blocked.indexOf(l)<0;});
  var fl=open[Math.floor(Math.random()*open.length)];
  for(var j=0;j<4;j++)things.push({kind:'fruit',lane:fl,z:z+3+j*1.6,y:.35,c:(j+Math.floor(z))%3});
}

/* ---------- update ---------- */
function update(dt){
  clock+=dt;
  slow=Math.min(1,slow+dt*.6);
  var v=SPEED[S.speed]*(1+Math.min(.25,dist/3000))*slow,dz=v*dt,i;
  dist+=dz;P.step+=dz*1.4;
  nextRow-=dz;
  if(nextRow<=0){spawnRow(FAR);nextRow=GAP[S.speed]*(.85+Math.random()*.3);}
  P.x+=(P.lane-P.x)*Math.min(1,dt*14);
  if(P.y>0||P.vy>0){P.vy-=19*dt;P.y=Math.max(0,P.y+P.vy*dt);if(P.y===0)P.vy=0;}
  if(P.slide>0)P.slide-=dt;
  if(P.inv>0)P.inv-=dt;
  for(i=things.length-1;i>=0;i--){
    var t=things[i],oz=t.z;t.z-=dz;
    if(t.z<-3){things.splice(i,1);continue;}
    var sameLane=Math.abs(t.lane-P.x)<.5;
    if(t.kind==='fruit'){
      if(!t.got&&sameLane&&Math.abs(t.z)<.7&&Math.abs(P.y+.4-t.y)<.75){t.got=true;S.fruit++;showFruit();sfx.fruit();burst(t,'#FFD84D');things.splice(i,1);}
      continue;
    }
    if(oz>0&&t.z<=0&&sameLane&&P.inv<=0&&!t.hit){
      var safe=(t.kind==='log'&&P.y>.38)||(t.kind==='branch'&&P.slide>0);
      if(!safe){t.hit=true;bonk(t);}
    }
  }
  var m=Math.floor(dist);$('dist').textContent=m;
  if(Math.floor(m/250)>milestone){milestone=Math.floor(m/250);toast(milestone*250+' meters!');sfx.cheer();}
}
function bonk(t){
  P.inv=1.3;slow=.35;
  toast(t.kind==='bush'?'Bonk! Try another lane':t.kind==='log'?'Oops! Jump the logs':'Duck! Slide under');
  sfx.bonk();burst({lane:P.x,z:.5,y:.8},'#FFFFFF');
}
function burst(t,col){
  if(reduceMotion)return;
  var p=proj(t.lane,Math.max(.2,t.z),t.y||0);
  for(var i=0;i<8;i++)particles.push({x:p.x,y:p.y,vx:(Math.random()-.5)*300,vy:-Math.random()*300-60,life:.5+Math.random()*.4,col:col,s:5+Math.random()*5});
}
function jump(){if(!playing)return;if(P.y===0&&P.vy===0){P.vy=6.6;P.slide=0;sfx.jump();}}
function slide(){if(!playing)return;P.slide=.75;if(P.y>0)P.vy=Math.min(P.vy,-8);sfx.slide();}
function lane(d){if(!playing)return;var n=Math.max(-1,Math.min(1,P.lane+d));if(n!==P.lane){P.lane=n;sfx.swish();}}

/* ---------- drawing: a simple one point perspective ---------- */
var horizon,ground,laneW;
function proj(x,z,y){
  var s=CAM/(CAM+Math.max(z,-CAM*.6));
  return {x:Wd/2+x*laneW*s,y:horizon+(ground-horizon)*s-(y||0)*laneW*s,s:s};
}
function ell(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);}
function quad(a,b,c,d){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);ctx.closePath();ctx.fill();}
function draw(){
  var dpr=window.devicePixelRatio||1,i,k;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var g=ctx.createLinearGradient(0,0,0,horizon);g.addColorStop(0,'#9FE3FF');g.addColorStop(1,'#E9FBD8');
  ctx.fillStyle=g;ctx.fillRect(0,0,Wd,horizon+2);
  ctx.fillStyle='#FFE27A';ell(Wd*.82,horizon*.35,horizon*.16,horizon*.16);ctx.fill();
  ctx.fillStyle='#9ADBA9';
  for(i=0;i<6;i++){ell(((i*Wd/4-dist*.4)%(Wd*1.5)+Wd*1.5)%(Wd*1.5)-Wd*.25,horizon,Wd*.2,horizon*.25);ctx.fill();}
  ctx.fillStyle='#5CC27A';ctx.fillRect(0,horizon,Wd,Ht-horizon);
  /* path, lane lines, moving stripes */
  ctx.fillStyle='#E4B87A';quad(proj(-1.6,FAR),proj(1.6,FAR),proj(1.6,-2),proj(-1.6,-2));
  var off=dist%3;
  for(k=-1;k<FAR/3;k++){
    var z0=k*3-off,z1=z0+1.5;if(z1<-2)continue;
    ctx.fillStyle='rgba(255,255,255,.18)';quad(proj(-1.6,z0),proj(1.6,z0),proj(1.6,z1),proj(-1.6,z1));
  }
  ctx.strokeStyle='rgba(120,80,40,.35)';ctx.lineWidth=3;
  [-.5,.5].forEach(function(x){var a=proj(x,FAR),b=proj(x,-2);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();});
  /* side trees and everything on the path, far to near */
  var list=things.slice();
  for(k=0;k<FAR/4+1;k++){var tz=k*4-(dist%4);list.push({kind:'tree',lane:-2.4,z:tz,c:k});list.push({kind:'tree',lane:2.4,z:tz+2,c:k+3});}
  list.sort(function(a,b){return b.z-a.z;});
  var drewMango=false;
  list.forEach(function(t){
    if(!drewMango&&t.z<-.05){mango();drewMango=true;}
    if(t.z>FAR||t.z<-2)return;
    var p=proj(t.lane,t.z,0),w=laneW*p.s;
    ctx.globalAlpha=Math.min(1,(FAR-t.z)/8);
    ctx.strokeStyle=INK;ctx.lineWidth=Math.max(1,3*p.s);
    if(t.kind==='tree'){
      ctx.fillStyle='#8A6A4A';ctx.fillRect(p.x-w*.08,p.y-w*1.3,w*.16,w*1.3);
      ctx.fillStyle=t.c%2?'#3FA86A':'#4FB776';ell(p.x,p.y-w*1.5,w*.55,w*.45);ctx.fill();ell(p.x-w*.3,p.y-w*1.25,w*.35,w*.3);ctx.fill();ell(p.x+w*.3,p.y-w*1.25,w*.35,w*.3);ctx.fill();
    }else if(t.kind==='bush'){
      ctx.fillStyle='#2F9A57';ell(p.x,p.y-w*.38,w*.46,w*.42);ctx.fill();ctx.stroke();
      ctx.fillStyle='#3FB86A';ell(p.x-w*.2,p.y-w*.5,w*.2,w*.18);ctx.fill();ell(p.x+w*.18,p.y-w*.3,w*.18,w*.15);ctx.fill();
      ctx.fillStyle='#FF6FA8';ell(p.x+w*.1,p.y-w*.6,w*.06,w*.06);ctx.fill();ell(p.x-w*.25,p.y-w*.28,w*.05,w*.05);ctx.fill();
    }else if(t.kind==='log'){
      ctx.fillStyle='#A8703F';ctx.beginPath();ctx.rect(p.x-w*.45,p.y-w*.3,w*.9,w*.3);ctx.fill();ctx.stroke();
      ctx.fillStyle='#E8B87A';ell(p.x+w*.45,p.y-w*.15,w*.07,w*.15);ctx.fill();ctx.stroke();
      ctx.strokeStyle='rgba(60,30,10,.4)';ctx.beginPath();ctx.moveTo(p.x-w*.35,p.y-w*.18);ctx.lineTo(p.x+w*.2,p.y-w*.18);ctx.stroke();
    }else if(t.kind==='branch'){
      ctx.fillStyle='#8A6A4A';
      ctx.fillRect(p.x-w*.5,p.y-w*1.15,w*.08,w*1.15);ctx.fillRect(p.x+w*.42,p.y-w*1.15,w*.08,w*1.15);
      ctx.beginPath();ctx.rect(p.x-w*.55,p.y-w*.95,w*1.1,w*.2);ctx.fill();ctx.stroke();
      ctx.fillStyle='#4FB776';for(i=0;i<4;i++){ell(p.x-w*.4+i*w*.27,p.y-w*.72,w*.09,w*.06);ctx.fill();}
    }else if(t.kind==='fruit'){
      var q=proj(t.lane,t.z,t.y+Math.sin(clock*4+t.z)*.05),r=w*.14;
      if(t.c===2){ctx.strokeStyle=INK;ctx.lineWidth=r*.9;ctx.beginPath();ctx.arc(q.x,q.y-r*.6,r,Math.PI*.15,Math.PI*.85);ctx.stroke();ctx.strokeStyle='#FFD93B';ctx.lineWidth=r*.5;ctx.beginPath();ctx.arc(q.x,q.y-r*.6,r,Math.PI*.15,Math.PI*.85);ctx.stroke();}
      else{ctx.fillStyle=t.c?'#FF5A5F':'#FF9F1C';ell(q.x,q.y,r,r);ctx.fill();ctx.stroke();ctx.fillStyle='#3DBE6C';ell(q.x+r*.4,q.y-r,r*.45,r*.25);ctx.fill();}
    }
    ctx.globalAlpha=1;
  });
  if(!drewMango)mango();
  particles.forEach(function(q){ctx.globalAlpha=Math.min(1,q.life*2.5);ctx.fillStyle=q.col;ctx.fillRect(q.x-q.s/2,q.y-q.s/2,q.s,q.s);});
  ctx.globalAlpha=1;
}
/* Mango seen from behind */
function mango(){
  if(P.inv>0&&Math.floor(clock*12)%2===0)return;
  var p=proj(P.x,0,0),w=laneW*p.s*.95,BR='#9A5B32',sl=P.slide>0,lift=P.y*laneW*p.s;
  var sq=sl?.55:1,run=P.y>0?0:Math.sin(P.step*2.2);
  ctx.save();ctx.translate(p.x,p.y-lift);
  ctx.fillStyle='rgba(0,0,0,.18)';ell(0,lift,w*.3,w*.07);ctx.fill();
  ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.lineCap='round';
  ctx.strokeStyle=BR;ctx.lineWidth=w*.07;
  ctx.beginPath();ctx.moveTo(-w*.1,-w*.08);ctx.lineTo(-w*.12,-w*.02+run*w*.04);ctx.moveTo(w*.1,-w*.08);ctx.lineTo(w*.12,-w*.02-run*w*.04);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,-w*.25*sq);ctx.quadraticCurveTo(w*.32,-w*.2*sq,w*.26,-w*.5*sq);ctx.stroke();
  ctx.fillStyle=BR;ell(0,-w*.32*sq,w*.22,w*.24*sq);ctx.fill();
  ctx.lineWidth=w*.06;ctx.beginPath();ctx.moveTo(-w*.18,-w*.4*sq);ctx.lineTo(-w*.3,-w*.3*sq-run*w*.08);ctx.moveTo(w*.18,-w*.4*sq);ctx.lineTo(w*.3,-w*.3*sq+run*w*.08);ctx.stroke();
  ctx.fillStyle=BR;ell(0,-w*.66*sq,w*.2,w*.19*sq);ctx.fill();
  ell(-w*.2,-w*.72*sq,w*.08,w*.08*sq);ctx.fill();ell(w*.2,-w*.72*sq,w*.08,w*.08*sq);ctx.fill();
  ctx.fillStyle='#F6CFA0';ell(-w*.2,-w*.72*sq,w*.04,w*.04*sq);ctx.fill();ell(w*.2,-w*.72*sq,w*.04,w*.04*sq);ctx.fill();
  ctx.fillStyle='#B8743F';ell(0,-w*.74*sq,w*.07,w*.04*sq);ctx.fill();
  ctx.restore();
}
function resize(){
  var r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  Wd=Math.max(200,r.width-12);Ht=Math.max(200,r.height-12);
  cv.width=Math.round(Wd*dpr);cv.height=Math.round(Ht*dpr);
  horizon=Ht*.34;ground=Ht*.9;laneW=Math.min(Wd*.27,Ht*.42);
  if(P)draw();
}

/* ---------- input: swipe anywhere, tap to jump ---------- */
var sw=null;
cv.addEventListener('pointerdown',function(e){if(!playing)return;e.preventDefault();sw={id:e.pointerId,x:e.clientX,y:e.clientY,done:false};});
cv.addEventListener('pointermove',function(e){
  if(!sw||e.pointerId!==sw.id||sw.done)return;
  var dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(Math.hypot(dx,dy)<30)return;
  if(Math.abs(dx)>Math.abs(dy))lane(dx>0?1:-1);else if(dy<0)jump();else slide();
  sw.done=true;
});
['pointerup','pointercancel'].forEach(function(ev){cv.addEventListener(ev,function(e){
  if(!sw||e.pointerId!==sw.id)return;
  if(ev==='pointerup'&&!sw.done)jump();
  sw=null;
});});
document.addEventListener('keydown',function(e){
  var k=e.key;
  if(k==='ArrowLeft')lane(-1);else if(k==='ArrowRight')lane(1);else if(k==='ArrowUp'||k===' ')jump();else if(k==='ArrowDown')slide();
  else if(k==='p'||k==='P'){if(playing)pause();else play();return;}else return;
  e.preventDefault();
});
document.addEventListener('gesturestart',function(e){e.preventDefault();});

/* ---------- UI ---------- */
var toastTimer=null;
function toast(msg){toastEl.textContent=msg;toastEl.classList.remove('show');void toastEl.offsetWidth;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastEl.classList.remove('show');},1150);}
function showFruit(){$('fruit').textContent=S.fruit;var b=$('fruitBox');b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');}
function syncOpts(){
  document.querySelectorAll('[data-speed]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.speed===S.speed));});
  $('soundBtn').textContent=S.sound?'Sound on':'Sound off';$('soundBtn').setAttribute('aria-pressed',String(S.sound));
}
function save(){try{localStorage.setItem('mangoDash',JSON.stringify({speed:S.speed,sound:S.sound}));}catch(e){}}
var ac=null;
function initAudio(){try{if(!ac){var AC=window.AudioContext||window.webkitAudioContext;if(AC)ac=new AC();}if(ac&&ac.state==='suspended')ac.resume();}catch(e){ac=null;}}
function tone(f,d,type,v,when,f2){
  if(!ac||!S.sound)return;
  try{var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+(when||0);o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
var sfx={
  jump:function(){tone(300,.16,'triangle',.1,0,600);},
  slide:function(){tone(500,.18,'sine',.07,0,200);},
  swish:function(){tone(700,.07,'sine',.05,0,900);},
  fruit:function(){tone(784,.08,'triangle',.1);tone(1047,.12,'triangle',.1,.07);},
  bonk:function(){tone(180,.18,'square',.07,0,110);},
  cheer:function(){[523,659,784,1047].forEach(function(f,i){tone(f,.18,'triangle',.11,i*.09);});}
};
function play(){initAudio();playing=true;overlay.hidden=true;last=performance.now();}
function pause(){
  if(!playing)return;playing=false;sw=null;
  $('cardTitle').textContent='Taking a break';$('cardSub').textContent='';$('playBtn').textContent='Keep going';overlay.hidden=false;
}
$('playBtn').addEventListener('click',play);
$('pauseBtn').addEventListener('click',pause);
$('soundBtn').addEventListener('click',function(){S.sound=!S.sound;if(S.sound)initAudio();syncOpts();save();});
document.querySelectorAll('[data-speed]').forEach(function(b){b.addEventListener('click',function(){S.speed=b.dataset.speed;syncOpts();save();});});
document.addEventListener('visibilitychange',function(){if(document.hidden)pause();});

function frame(t){
  var dt=Math.min(1/30,(t-last)/1000);last=t;
  if(dt>0){
    if(playing)update(dt);else clock+=dt;
    if(particles.length){particles.forEach(function(q){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=700*dt;q.life-=dt;});particles=particles.filter(function(q){return q.life>0;});}
  }
  draw();requestAnimationFrame(frame);
}
function start(data){
  data=data||{};
  try{var s=JSON.parse(localStorage.getItem('mangoDash')||'{}');if(SPEED[s.speed])S.speed=s.speed;if(typeof s.sound==='boolean')S.sound=s.sound;}catch(e){}
  if(typeof data.fruit==='number')S.fruit=data.fruit;
  $('fruit').textContent=S.fruit;syncOpts();
  reset();resize();
  if(window.ResizeObserver)new ResizeObserver(resize).observe(cv);
  window.addEventListener('resize',resize);
  last=performance.now();requestAnimationFrame(frame);
}
var hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(function(){return {fruit:S.fruit};});
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data?hot.data:{});
})();
</script>
</body>
</html>
