<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sweet Swap</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kid Games">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: sticker book, bake shop edition. Header with score and moves, a goal bar, then an 8 by 8 tray of desserts on a checkered tablecloth. */
:root{
  --page:#FFC4DA;
  --page-dot:#FFB0CE;
  --ink:#5A2440;
  --paper:#FFFBF4;
  --go:#7BE38F;
  --font-display:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --font-body:'Nunito','Avenir Next','Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background-color:var(--page);
  background-image:radial-gradient(var(--page-dot) 18%,transparent 19%);
  background-size:44px 44px;
  color:var(--ink);font-family:var(--font-body);font-weight:700;
  overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding:12px 16px 16px}
.sticker{font-family:var(--font-display);font-weight:600;color:var(--ink);background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink)}
button{cursor:pointer;font:inherit;color:inherit}
button.sticker:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}
#info{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,5vw,40px);line-height:1;margin:0;margin-right:auto;letter-spacing:.5px;text-shadow:3px 3px 0 var(--paper)}
.stat{display:flex;align-items:center;gap:8px;padding:4px 16px 4px 12px;font-size:26px;font-variant-numeric:tabular-nums;min-height:56px}
.stat small{font-size:16px;font-family:var(--font-body);font-weight:800}
.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.2) rotate(-5deg)}}
a.mini{text-decoration:none}
a.mini:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.mini{min-height:54px;min-width:54px;padding:0 12px;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.mini svg{width:24px;height:24px}
#goal{display:flex;align-items:center;gap:12px;padding:6px 14px;font-size:18px}
#goal .track{flex:1;height:22px;border:3px solid var(--ink);border-radius:12px;background:#FFE3EE;overflow:hidden}
#goal .fill{height:100%;width:0;background:linear-gradient(90deg,#FF7AB6,#FFC93D);transition:width .3s}
#stage{flex:1;min-height:0;position:relative}
#tray{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:6px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);background:#FFFBF4;touch-action:none}
#overlay{position:absolute;inset:0;display:grid;place-items:center;z-index:3}
#overlay[hidden]{display:none}
#card{padding:20px 28px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:min(96%,520px);max-height:98%;overflow:auto}
#card h2{font-family:var(--font-display);font-weight:700;font-size:32px;margin:0;text-wrap:balance}
#cardSub{margin:0;font-size:18px}
#cardSub:empty{display:none}
#cardStars{display:flex;gap:8px}
#cardStars:empty{display:none}
#cardStars svg{width:50px;height:50px}
#btnRow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
#playBtn{background:var(--go);font-size:30px;padding:12px 38px;min-height:74px;border-radius:26px}
#moreBtn{background:#FFE066;font-size:22px;padding:10px 22px;min-height:64px;border-radius:22px}
#moreBtn[hidden]{display:none}
#levels{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#levels button{min-width:58px;min-height:54px;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:4px 10px}
#levels button small{font-size:12px;margin-top:3px;letter-spacing:1px}
#levels button[disabled]{opacity:.4;cursor:default}
#levels button.on{background:#FFE066}
#opts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
#toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(0);z-index:2;pointer-events:none;padding:8px 22px;font-size:clamp(24px,5vw,38px);white-space:nowrap;background:#FFE066}
#toast.show{animation:pop 1.1s both}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0) rotate(-8deg)}18%{transform:translate(-50%,-50%) scale(1.1) rotate(3deg)}28%,78%{transform:translate(-50%,-50%) scale(1) rotate(-2deg);opacity:1}100%{transform:translate(-50%,-50%) scale(.9);opacity:0}}
@media (prefers-reduced-motion:reduce){#toast.show{animation:none;transform:translate(-50%,-50%) scale(1)}.bump{animation:none}#goal .fill{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header id="info">
    <h1>Sweet Swap</h1>
    <div id="scoreBox" class="sticker stat" aria-live="polite" aria-label="Score"><small>Score</small><span id="score">0</span></div>
    <div id="moveBox" class="sticker stat" aria-label="Moves left"><small>Moves</small><span id="moves">0</span></div>
    <div class="sticker stat"><small>Level</small><span id="level">1</span></div>
    <a id="homeBtn" href="index.html" class="sticker mini" aria-label="Back to all games">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5L12 4l8.5 7.5" fill="none" stroke="#5A2440" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9.5h4.5v-5h3v5H18V10" fill="none" stroke="#5A2440" stroke-width="2.6" stroke-linejoin="round"/></svg>
    </a>
    <button id="pauseBtn" class="sticker mini" aria-label="Pause">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5" fill="#5A2440"/><rect x="14" y="4" width="5" height="16" rx="1.5" fill="#5A2440"/></svg>
    </button>
  </header>
  <div id="goal" class="sticker"><span id="goalText">Goal: 1000</span><div class="track"><div class="fill" id="goalFill"></div></div></div>
  <main id="stage">
    <canvas id="tray" aria-label="Tray of desserts"></canvas>
    <div id="toast" class="sticker" aria-hidden="true"></div>
    <div id="overlay">
      <div id="card" class="sticker">
        <h2 id="cardTitle">Welcome to the Sweet Shop!</h2>
        <div id="cardStars"></div>
        <p id="cardSub">Swipe a treat to swap it with its neighbor. Line up 3 of the same dessert to gobble them up. Match 4 or 5 for a surprise!</p>
        <div id="btnRow">
          <button id="playBtn" class="sticker">Play</button>
          <button id="moreBtn" class="sticker" hidden>+5 moves</button>
        </div>
        <div id="levels" role="group" aria-label="Pick a level"></div>
        <div id="opts"><button id="soundBtn" class="sticker mini" aria-pressed="true">Sound on</button></div>
      </div>
    </div>
  </main>
</div>
<script>
(function(){
'use strict';
var N=8,INK='#5A2440';
var NAMES=['Milkshake','Cake','Pie','Chocolate','Popsicle','Cupcake'];
var TINT=['#FF8FC0','#FFD45C','#B57BFF','#A0603A','#5CC8FF','#6FE0B0'];
/* each level: score goal, moves, how many kinds of dessert */
var LEVELS=[[800,25,5],[1500,25,5],[2200,25,5],[3000,24,6],[4000,24,6],[5000,22,6],[6500,22,6],[8000,20,6]];
function $(id){return document.getElementById(id);}
var cv=$('tray'),ctx=cv.getContext('2d'),stage=$('stage'),overlay=$('overlay'),toastEl=$('toast');
var reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var S={sound:true,level:1,best:0,stars:[]};
var g,kinds=5,score=0,moves=0,goal=0,busy=false,state='menu',sel=null,clock=0,last=0,cs=60,bits=[],idle=0,hint=null,uid=1,extra=false;

/* ---------- board ---------- */
function tile(t){return {t:t,sp:'',fy:0,ox:0,oy:0,pop:0,id:uid++};}
function rnd(){return Math.floor(Math.random()*kinds);}
function newBoard(){
  g=[];
  for(var r=0;r<N;r++){g.push([]);for(var c=0;c<N;c++){
    var t;do{t=rnd();}while((c>=2&&g[r][c-1].t===t&&g[r][c-2].t===t)||(r>=2&&g[r-1][c].t===t&&g[r-2][c].t===t));
    var tl=tile(t);tl.fy=-(N+2)+r*.2;g[r].push(tl);
  }}
  if(!findMove())newBoard();
}
function loadLevel(n){
  S.level=n;var L=LEVELS[(n-1)%LEVELS.length];
  goal=L[0];moves=L[1];kinds=L[2];score=0;extra=false;
  newBoard();sel=null;hint=null;idle=0;
  $('level').textContent=n;showHud();
}
function findMatches(){
  var runs=[];
  for(var r=0;r<N;r++){var c=0;while(c<N){var t=g[r][c].t,e=c;while(e+1<N&&g[r][e+1].t===t)e++;if(e-c>=2){var cells=[];for(var k=c;k<=e;k++)cells.push([r,k]);runs.push({cells:cells,dir:'h'});}c=e+1;}}
  for(var cc=0;cc<N;cc++){var rr=0;while(rr<N){var t2=g[rr][cc].t,e2=rr;while(e2+1<N&&g[e2+1][cc].t===t2)e2++;if(e2-rr>=2){var cl=[];for(var k2=rr;k2<=e2;k2++)cl.push([k2,cc]);runs.push({cells:cl,dir:'v'});}rr=e2+1;}}
  return runs;
}
function swapGrid(a,b){var t=g[a[0]][a[1]];g[a[0]][a[1]]=g[b[0]][b[1]];g[b[0]][b[1]]=t;}
function findMove(){
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    var opts=[[r,c+1],[r+1,c]];
    for(var i=0;i<2;i++){var o=opts[i];if(o[0]>=N||o[1]>=N)continue;
      if(g[r][c].sp||g[o[0]][o[1]].sp)return [[r,c],o];
      swapGrid([r,c],o);var m=findMatches().length;swapGrid([r,c],o);if(m)return [[r,c],o];}
  }
  return null;
}

/* ---------- timing helpers ---------- */
function wait(ms){return new Promise(function(res){setTimeout(res,reduceMotion?Math.min(ms,60):ms);});}
function settled(){return new Promise(function(res){(function chk(){var moving=false;for(var r=0;r<N;r++)for(var c=0;c<N;c++){var t=g[r][c];if(t&&(Math.abs(t.fy)>.01||Math.abs(t.ox)>.01||Math.abs(t.oy)>.01))moving=true;}if(moving)requestAnimationFrame(chk);else res();})();});}

/* ---------- a move ---------- */
async function trySwap(a,b){
  if(busy||state!=='play')return;
  busy=true;sel=null;hint=null;idle=0;
  var A=g[a[0]][a[1]],B=g[b[0]][b[1]];
  swapGrid(a,b);
  A.ox=a[1]-b[1];A.oy=a[0]-b[0];B.ox=b[1]-a[1];B.oy=b[0]-a[0];
  sfx.swap();await settled();
  var runs=findMatches();
  if(!runs.length&&!A.sp&&!B.sp){
    swapGrid(a,b);A.ox=b[1]-a[1];A.oy=b[0]-a[0];B.ox=a[1]-b[1];B.oy=a[0]-b[0];
    sfx.nope();await settled();busy=false;return;
  }
  moves--;showHud();
  var forced=[];
  if(!runs.length){if(A.sp)forced.push(b);if(B.sp)forced.push(a);}
  await resolve([a,b],forced);
  busy=false;afterMove();
}
async function resolve(swapped,forced){
  var combo=0;
  while(true){
    var runs=findMatches();
    if(!runs.length&&!(forced&&forced.length))break;
    combo++;
    var clear={},make=[];
    function key(r,c){return r+','+c;}
    /* special treats: 4 in a row makes a whipped cream line, 5 or a corner makes a sprinkle bomb */
    var count={};
    runs.forEach(function(run){run.cells.forEach(function(p){count[key(p[0],p[1])]=(count[key(p[0],p[1])]||0)+1;});});
    runs.forEach(function(run){
      run.cells.forEach(function(p){clear[key(p[0],p[1])]=p;});
      var spot=null;
      if(swapped)run.cells.forEach(function(p){swapped.forEach(function(s){if(s[0]===p[0]&&s[1]===p[1])spot=p;});});
      if(!spot)spot=run.cells[Math.floor(run.cells.length/2)];
      var corner=run.cells.some(function(p){return count[key(p[0],p[1])]>1;});
      if(run.cells.length>=5||corner)make.push({p:corner?run.cells.filter(function(p){return count[key(p[0],p[1])]>1;})[0]:spot,sp:'bomb',t:g[spot[0]][spot[1]].t});
      else if(run.cells.length===4)make.push({p:spot,sp:run.dir==='h'?'col':'row',t:g[spot[0]][spot[1]].t});
    });
    if(forced)forced.forEach(function(p){clear[key(p[0],p[1])]=p;});
    forced=null;
    /* specials caught in the clear set off their own effect */
    var queue=Object.keys(clear).map(function(k){return clear[k];}),seen={};
    while(queue.length){
      var p=queue.pop(),k=key(p[0],p[1]);if(seen[k])continue;seen[k]=1;clear[k]=p;
      var t=g[p[0]][p[1]];if(!t||!t.sp)continue;
      var area=[];
      if(t.sp==='row')for(var i=0;i<N;i++)area.push([p[0],i]);
      if(t.sp==='col')for(var j=0;j<N;j++)area.push([j,p[1]]);
      if(t.sp==='bomb')for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){var rr=p[0]+dr,cc=p[1]+dc;if(rr>=0&&cc>=0&&rr<N&&cc<N)area.push([rr,cc]);}
      blast(p,t.sp);
      area.forEach(function(q){queue.push(q);});
    }
    /* don't eat the spots where new specials are about to appear */
    make.forEach(function(m){delete clear[key(m.p[0],m.p[1])];});
    var n=0;
    Object.keys(clear).forEach(function(k){var p=clear[k],t=g[p[0]][p[1]];if(t){t.pop=1;n++;}});
    var pts=n*10*combo+make.length*30;score+=pts;showHud(true);
    if(combo>=2)toast(['Yum!','Delicious!','Sweet!','Tasty!','Scrumptious!'][Math.min(4,combo-2)]+(combo>=3?' x'+combo:''));
    sfx.pop(combo);
    make.forEach(function(m){var t=g[m.p[0]][m.p[1]];t.t=m.t;t.sp=m.sp;t.pop=0;burst(m.p[1]+.5,m.p[0]+.5,'#FFFFFF',10);});
    if(make.length)sfx.special();
    await wait(230);
    Object.keys(clear).forEach(function(k){var p=clear[k];if(g[p[0]][p[1]]&&g[p[0]][p[1]].pop){burst(p[1]+.5,p[0]+.5,TINT[g[p[0]][p[1]].t],5);g[p[0]][p[1]]=null;}});
    /* treats fall down, new ones drop in from the top */
    for(var c=0;c<N;c++){
      var write=N-1;
      for(var r=N-1;r>=0;r--){if(g[r][c]){if(write!==r){g[write][c]=g[r][c];g[write][c].fy-=(write-r);g[r][c]=null;}write--;}}
      for(var r2=write;r2>=0;r2--){var nt=tile(rnd());nt.fy=-(write+1)-.3;g[r2][c]=nt;}
    }
    await settled();
    swapped=null;
  }
}
function blast(p,sp){
  if(reduceMotion)return;
  if(sp==='row')for(var i=0;i<N;i++)burst(i+.5,p[0]+.5,'#FFFFFF',2);
  else if(sp==='col')for(var j=0;j<N;j++)burst(p[1]+.5,j+.5,'#FFFFFF',2);
  else burst(p[1]+.5,p[0]+.5,'#FFE066',18);
  sfx.blast();
}
function afterMove(){
  if(score>=goal){win();return;}
  if(moves<=0){outOfMoves();return;}
  if(!findMove()){toast('Shuffle!');shuffle();}
}
function shuffle(){
  var all=[];for(var r=0;r<N;r++)for(var c=0;c<N;c++)all.push(g[r][c]);
  var tries=0;
  do{for(var i=all.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=all[i];all[i]=all[j];all[j]=t;}
    for(var k=0;k<all.length;k++){g[Math.floor(k/N)][k%N]=all[k];}tries++;}
  while((findMatches().length||!findMove())&&tries<60);
  if(tries>=60)newBoard();
  for(var r2=0;r2<N;r2++)for(var c2=0;c2<N;c2++)g[r2][c2].oy=-.6;
  sfx.special();
}
function burst(x,y,col,n){
  if(reduceMotion)return;
  for(var i=0;i<n;i++)bits.push({x:x,y:y,vx:(Math.random()-.5)*7,vy:-Math.random()*6-1,life:.5+Math.random()*.4,col:col,s:.08+Math.random()*.08});
}

/* ---------- drawing the desserts (all original, drawn in code) ---------- */
function ell(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,Math.max(.001,rx),Math.max(.001,ry),0,0,Math.PI*2);}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function face(x,y,s){
  ctx.fillStyle=INK;ell(x-.09*s,y,.03*s,.038*s);ctx.fill();ell(x+.09*s,y,.03*s,.038*s);ctx.fill();
  ctx.strokeStyle=INK;ctx.lineWidth=.025;ctx.beginPath();ctx.arc(x,y+.04*s,.05*s,Math.PI*.15,Math.PI*.85);ctx.stroke();
  ctx.fillStyle='rgba(255,90,140,.45)';ell(x-.16*s,y+.05*s,.035*s,.022*s);ctx.fill();ell(x+.16*s,y+.05*s,.035*s,.022*s);ctx.fill();
}
function dessert(t,x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle=INK;ctx.lineWidth=.04;
  if(t===0){ /* milkshake */
    ctx.strokeStyle='#FF5A6E';ctx.lineWidth=.06;ctx.beginPath();ctx.moveTo(.08,-.18);ctx.lineTo(.2,-.42);ctx.stroke();ctx.strokeStyle=INK;ctx.lineWidth=.04;
    ctx.fillStyle='#FF8FC0';ctx.beginPath();ctx.moveTo(-.22,-.12);ctx.lineTo(.22,-.12);ctx.lineTo(.15,.36);ctx.lineTo(-.15,.36);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(-.14,-.06,.05,.36);
    ctx.fillStyle='#FFFFFF';ell(-.1,-.15,.13,.09);ctx.fill();ell(.1,-.15,.13,.09);ctx.fill();ell(0,-.24,.13,.1);ctx.fill();
    ctx.beginPath();ctx.moveTo(-.23,-.13);ctx.quadraticCurveTo(-.2,-.32,0,-.34);ctx.quadraticCurveTo(.2,-.32,.23,-.13);ctx.stroke();
    ctx.fillStyle='#E8243C';ell(0,-.36,.06,.06);ctx.fill();ctx.stroke();
    face(0,.12,1);
  }else if(t===1){ /* cake slice */
    ctx.fillStyle='#FFD45C';ctx.beginPath();ctx.moveTo(-.32,.3);ctx.lineTo(.32,.3);ctx.lineTo(.32,-.12);ctx.lineTo(-.32,.12);ctx.closePath();ctx.fill();
    ctx.fillStyle='#FF8FC0';ctx.fillRect(-.32,.06,.64,.06);ctx.beginPath();ctx.moveTo(-.32,.12);ctx.lineTo(.32,-.12);ctx.lineTo(.32,-.2);ctx.lineTo(-.32,.04);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(-.32,.3);ctx.lineTo(.32,.3);ctx.lineTo(.32,-.2);ctx.lineTo(-.32,.04);ctx.closePath();ctx.stroke();
    ctx.fillStyle='#FFFFFF';for(var i=0;i<4;i++){ell(-.2+i*.15,.05-i*.06+.0,.05,.035);ctx.fill();}
    ctx.fillStyle='#E8243C';ell(.22,-.26,.065,.065);ctx.fill();ctx.stroke();
    face(.02,.18,1);
  }else if(t===2){ /* pie slice */
    ctx.fillStyle='#E9A65A';ctx.beginPath();ctx.moveTo(-.34,.28);ctx.lineTo(.34,.28);ctx.lineTo(0,-.34);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#B57BFF';ctx.beginPath();ctx.moveTo(-.24,.2);ctx.lineTo(.24,.2);ctx.lineTo(0,-.2);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#E9A65A';ctx.lineWidth=.05;ctx.beginPath();ctx.moveTo(-.12,.2);ctx.lineTo(.05,-.12);ctx.moveTo(.12,.2);ctx.lineTo(-.05,-.12);ctx.moveTo(-.18,.08);ctx.lineTo(.18,.08);ctx.stroke();
    ctx.strokeStyle=INK;ctx.lineWidth=.04;ctx.fillStyle='#F2C07A';rrect(-.38,.24,.76,.1,.05);ctx.fill();ctx.stroke();
    face(0,.0,.9);
  }else if(t===3){ /* chocolate bar */
    ctx.fillStyle='#E8E8F0';rrect(-.3,.08,.6,.3,.05);ctx.fill();ctx.stroke();
    ctx.fillStyle='#FF5A6E';rrect(-.3,.14,.6,.18,.02);ctx.fill();
    ctx.fillStyle='#A0603A';rrect(-.27,-.36,.54,.48,.06);ctx.fill();ctx.stroke();
    ctx.strokeStyle='#7A4426';ctx.lineWidth=.03;
    for(var k=1;k<3;k++){ctx.beginPath();ctx.moveTo(-.27+k*.18,-.36);ctx.lineTo(-.27+k*.18,.1);ctx.stroke();}
    ctx.beginPath();ctx.moveTo(-.27,-.13);ctx.lineTo(.27,-.13);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(-.24,-.33,.12,.05);
    face(0,.0,1);
  }else if(t===4){ /* popsicle */
    ctx.fillStyle='#E9C08A';rrect(-.05,.18,.1,.24,.04);ctx.fill();ctx.stroke();
    ctx.fillStyle='#5CC8FF';ctx.beginPath();ctx.moveTo(-.2,.24);ctx.lineTo(-.2,-.2);ctx.arc(0,-.2,.2,Math.PI,0);ctx.lineTo(.2,.24);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#FFFFFF';ctx.beginPath();ctx.moveTo(-.2,-.06);ctx.quadraticCurveTo(-.1,.0,0,-.06);ctx.quadraticCurveTo(.1,.0,.2,-.06);ctx.lineTo(.2,-.18);ctx.lineTo(-.2,-.18);ctx.closePath();ctx.globalAlpha=.6;ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle='rgba(255,255,255,.4)';rrect(-.14,-.3,.05,.3,.025);ctx.fill();
    face(0,.08,.9);
  }else{ /* cupcake */
    ctx.fillStyle='#FF8FC0';ctx.beginPath();ctx.moveTo(-.26,.02);ctx.lineTo(.26,.02);ctx.lineTo(.18,.36);ctx.lineTo(-.18,.36);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.strokeStyle='#E8609A';ctx.lineWidth=.03;for(var w=-2;w<=2;w++){ctx.beginPath();ctx.moveTo(w*.09,.04);ctx.lineTo(w*.065,.34);ctx.stroke();}
    ctx.strokeStyle=INK;ctx.lineWidth=.04;
    ctx.fillStyle='#6FE0B0';ell(0,-.02,.3,.12);ctx.fill();ctx.stroke();ell(0,-.14,.22,.1);ctx.fill();ctx.stroke();ell(0,-.25,.12,.08);ctx.fill();ctx.stroke();
    var sp=['#FF5A6E','#FFD45C','#5CC8FF','#FFFFFF'];for(var q=0;q<6;q++){ctx.fillStyle=sp[q%4];ctx.save();ctx.translate(-.16+q*.065,-.06-(q%2)*.1);ctx.rotate(q);ctx.fillRect(-.025,-.008,.05,.016);ctx.restore();}
    face(0,.18,.85);
  }
  ctx.restore();
}
function draw(){
  var dpr=window.devicePixelRatio||1,r,c;
  ctx.setTransform(dpr*cs,0,0,dpr*cs,0,0);
  for(r=0;r<N;r++)for(c=0;c<N;c++){ctx.fillStyle=(r+c)%2?'#FFE3EE':'#FFF3F8';ctx.fillRect(c,r,1.01,1.01);}
  if(!g)return;
  for(r=0;r<N;r++)for(c=0;c<N;c++){
    var t=g[r][c];if(!t)continue;
    var x=c+.5+t.ox,y=r+.5+t.fy+t.oy,s=.92;
    if(t.pop)s*=Math.max(0,t.pop);
    if(sel&&sel[0]===r&&sel[1]===c){ctx.fillStyle='rgba(255,224,102,.75)';rrect(c+.04,r+.04,.92,.92,.18);ctx.fill();s*=1.08+Math.sin(clock*8)*.03;}
    if(hint&&((hint[0][0]===r&&hint[0][1]===c)||(hint[1][0]===r&&hint[1][1]===c)))y+=Math.sin(clock*10)*.05;
    if(t.sp){
      ctx.save();ctx.translate(x,y);
      if(t.sp==='bomb'){ctx.rotate(clock*1.5);ctx.fillStyle='rgba(255,224,102,.8)';ctx.beginPath();for(var i=0;i<16;i++){var a=i*Math.PI/8,rr=i%2?.32:.48;ctx[i?'lineTo':'moveTo'](Math.cos(a)*rr,Math.sin(a)*rr);}ctx.closePath();ctx.fill();}
      else{if(t.sp==='col')ctx.rotate(Math.PI/2);ctx.fillStyle='rgba(255,255,255,.95)';ctx.strokeStyle=INK;ctx.lineWidth=.03;
        var pulse=.02*Math.sin(clock*6);ctx.beginPath();ctx.moveTo(-.48-pulse,0);ctx.lineTo(-.34,-.12);ctx.lineTo(-.34,-.05);ctx.lineTo(.34,-.05);ctx.lineTo(.34,-.12);ctx.lineTo(.48+pulse,0);ctx.lineTo(.34,.12);ctx.lineTo(.34,.05);ctx.lineTo(-.34,.05);ctx.lineTo(-.34,.12);ctx.closePath();ctx.fill();ctx.stroke();}
      ctx.restore();
    }
    if(y>-.5)dessert(t.t,x,y,s);
  }
  bits.forEach(function(q){ctx.globalAlpha=Math.min(1,q.life*2.5);ctx.fillStyle=q.col;ctx.fillRect(q.x-q.s/2,q.y-q.s/2,q.s,q.s);});
  ctx.globalAlpha=1;
}
function resize(){
  var w=stage.clientWidth-14,h=stage.clientHeight-22;
  cs=Math.max(24,Math.floor(Math.min(w,h)/N));
  var dpr=window.devicePixelRatio||1;
  cv.style.width=N*cs+'px';cv.style.height=N*cs+'px';
  cv.width=N*cs*dpr;cv.height=N*cs*dpr;
}

/* ---------- touch: swipe a treat, or tap one then its neighbor ---------- */
var down=null;
function cell(e){var r=cv.getBoundingClientRect();return [Math.floor((e.clientY-r.top)/cs),Math.floor((e.clientX-r.left)/cs)];}
function inB(p){return p[0]>=0&&p[1]>=0&&p[0]<N&&p[1]<N;}
cv.addEventListener('pointerdown',function(e){
  if(state!=='play'||busy)return;e.preventDefault();
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  var p=cell(e);if(!inB(p))return;
  down={p:p,x:e.clientX,y:e.clientY,done:false};
});
cv.addEventListener('pointermove',function(e){
  if(!down||down.done)return;
  var dx=e.clientX-down.x,dy=e.clientY-down.y;
  if(Math.hypot(dx,dy)<cs*.35)return;
  var q=Math.abs(dx)>Math.abs(dy)?[down.p[0],down.p[1]+(dx>0?1:-1)]:[down.p[0]+(dy>0?1:-1),down.p[1]];
  down.done=true;if(inB(q))trySwap(down.p,q);
});
cv.addEventListener('pointerup',function(){
  if(!down)return;
  if(!down.done){
    var p=down.p;
    if(sel&&Math.abs(sel[0]-p[0])+Math.abs(sel[1]-p[1])===1)trySwap(sel,p);
    else if(sel&&sel[0]===p[0]&&sel[1]===p[1])sel=null;
    else{sel=p;sfx.pick();}
  }
  down=null;
});
document.addEventListener('gesturestart',function(e){e.preventDefault();});

/* ---------- win, out of moves, menus ---------- */
function starSvg(on){return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="'+(on?'#FFC400':'#F3E3EA')+'" stroke="#5A2440" stroke-width="1.6" stroke-linejoin="round"/></svg>';}
function win(){
  state='won';sfx.win();
  var st=extra?1:moves>=6?3:moves>=2?2:1;
  S.stars[S.level-1]=Math.max(S.stars[S.level-1]||0,st);S.best=Math.max(S.best,S.level);save();
  var lastLv=S.level===LEVELS.length;
  setTimeout(function(){
    $('cardTitle').textContent=lastLv?'You are the Sweet Shop champion!':'Sweet! Level done!';
    $('cardStars').innerHTML=starSvg(st>0)+starSvg(st>1)+starSvg(st>2);
    $('cardSub').textContent='Score '+score+' with '+moves+' moves to spare.';
    $('playBtn').textContent=lastLv?'Play again':'Next level';$('playBtn').dataset.go=String(lastLv?1:S.level+1);
    $('moreBtn').hidden=true;showLevels();overlay.hidden=false;
  },600);
}
function outOfMoves(){
  state='out';sfx.oops();
  $('cardTitle').textContent='Out of moves!';$('cardStars').innerHTML='';
  $('cardSub').textContent='You need '+(goal-score)+' more points. Want 5 more moves?';
  $('playBtn').textContent='Start over';$('playBtn').dataset.go=String(S.level);
  $('moreBtn').hidden=false;showLevels();overlay.hidden=false;
}
function showLevels(){
  var h='';
  LEVELS.forEach(function(_,i){var n=i+1,open=n<=S.best+1,st=S.stars[i]||0;
    h+='<button class="sticker'+(n===S.level?' on':'')+'" data-n="'+n+'"'+(open?'':' disabled')+' aria-label="Level '+n+'">'+n+'<small>'+('★'.repeat(st)+'☆'.repeat(3-st))+'</small></button>';});
  $('levels').innerHTML=h;
  document.querySelectorAll('#levels button').forEach(function(b){b.addEventListener('click',function(){
    loadLevel(+b.dataset.n);state='ready';$('playBtn').dataset.go='';$('moreBtn').hidden=true;
    $('cardTitle').textContent='Level '+b.dataset.n;$('cardStars').innerHTML='';$('cardSub').textContent='Reach '+goal+' points in '+moves+' moves.';$('playBtn').textContent='Play';showLevels();
  });});
}
function showHud(bump){
  $('score').textContent=score;$('moves').textContent=moves;
  $('goalText').textContent='Goal: '+goal;$('goalFill').style.width=Math.min(100,score/goal*100)+'%';
  $('moveBox').style.color=moves<=3?'#D0103A':'';
  if(bump){var b=$('scoreBox');b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');}
}
var toastTimer=null;
function toast(msg){toastEl.textContent=msg;toastEl.classList.remove('show');void toastEl.offsetWidth;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastEl.classList.remove('show');},1150);}
function save(){try{localStorage.setItem('sweetSwap',JSON.stringify({sound:S.sound,best:S.best,stars:S.stars}));}catch(e){}}
var ac=null;
function initAudio(){try{if(!ac){var AC=window.AudioContext||window.webkitAudioContext;if(AC)ac=new AC();}if(ac&&ac.state==='suspended')ac.resume();}catch(e){ac=null;}}
function tone(f,d,type,v,when,f2){
  if(!ac||!S.sound)return;
  try{var o=ac.createOscillator(),gn=ac.createGain(),t=ac.currentTime+(when||0);o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn);gn.connect(ac.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
var sfx={
  pick:function(){tone(620,.06,'triangle',.07);},
  swap:function(){tone(440,.08,'triangle',.07,0,620);},
  nope:function(){tone(220,.12,'sine',.08,0,180);},
  pop:function(c){var b=520+Math.min(c,6)*90;tone(b,.09,'triangle',.1,0,b*1.6);tone(b*1.5,.1,'triangle',.07,.05);},
  special:function(){[660,880,1100].forEach(function(f,i){tone(f,.1,'triangle',.08,i*.05);});},
  blast:function(){tone(300,.25,'sawtooth',.06,0,900);},
  oops:function(){tone(300,.35,'sine',.12,0,150);},
  win:function(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,.2,'triangle',.12,i*.1);});}
};
function play(){
  initAudio();
  var go=$('playBtn').dataset.go;if(go)loadLevel(+go);
  $('playBtn').dataset.go='';$('moreBtn').hidden=true;$('cardStars').innerHTML='';
  state='play';overlay.hidden=true;last=performance.now();
}
function pause(){
  if(state!=='play')return;state='paused';
  $('cardTitle').textContent='Taking a break';$('cardStars').innerHTML='';$('cardSub').textContent='';
  $('playBtn').textContent='Keep going';$('playBtn').dataset.go='';$('moreBtn').hidden=true;showLevels();overlay.hidden=false;
}
$('playBtn').addEventListener('click',play);
$('moreBtn').addEventListener('click',function(){moves+=5;extra=true;showHud();$('playBtn').dataset.go='';play();});
$('pauseBtn').addEventListener('click',pause);
$('soundBtn').addEventListener('click',function(){S.sound=!S.sound;if(S.sound)initAudio();$('soundBtn').textContent=S.sound?'Sound on':'Sound off';$('soundBtn').setAttribute('aria-pressed',String(S.sound));save();});
document.addEventListener('visibilitychange',function(){if(document.hidden)pause();});

function frame(t){
  var dt=Math.min(1/30,(t-last)/1000);last=t;
  if(dt>0){
    clock+=dt;
    if(g)for(var r=0;r<N;r++)for(var c=0;c<N;c++){var tl=g[r][c];if(!tl)continue;
      if(tl.fy<0)tl.fy=Math.min(0,tl.fy+dt*(9+Math.abs(tl.fy)*2));
      var k=Math.min(1,dt*14);tl.ox+=(0-tl.ox)*k;tl.oy+=(0-tl.oy)*k;if(Math.abs(tl.ox)<.01)tl.ox=0;if(Math.abs(tl.oy)<.01)tl.oy=0;
      if(tl.pop)tl.pop=Math.max(.01,tl.pop-dt*5);}
    if(state==='play'&&!busy){idle+=dt;if(idle>6&&!hint)hint=findMove();}
    bits.forEach(function(q){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=14*dt;q.life-=dt;});bits=bits.filter(function(q){return q.life>0;});
  }
  draw();requestAnimationFrame(frame);
}
try{var sv=JSON.parse(localStorage.getItem('sweetSwap')||'{}');if(typeof sv.sound==='boolean')S.sound=sv.sound;if(typeof sv.best==='number')S.best=Math.min(LEVELS.length,sv.best);if(Array.isArray(sv.stars))S.stars=sv.stars;}catch(e){}
$('soundBtn').textContent=S.sound?'Sound on':'Sound off';
loadLevel(Math.min(LEVELS.length,S.best+1));showLevels();resize();
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
window.addEventListener('resize',resize);
last=performance.now();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
