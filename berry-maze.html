<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout idea: sticker book, hedge maze edition. A garden maze of green hedges on a sandy path, framed like every other game. */
:root{
  --page:#FFC98F;
  --page-dot:#FFBA75;
  --ink:#3B2414;
  --paper:#FFFBF2;
  --go:#FFD84D;
  --font-display:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --font-body:'Nunito','Avenir Next','Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background-color:var(--page);
  background-image:radial-gradient(var(--page-dot) 18%,transparent 19%);
  background-size:44px 44px;
  color:var(--ink);font-family:var(--font-body);font-weight:700;
  overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding:12px 16px 16px}
.sticker{font-family:var(--font-display);font-weight:600;color:var(--ink);background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink)}
button{cursor:pointer;font:inherit;color:inherit}
button.sticker:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}
#info{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,5vw,40px);line-height:1;margin:0;margin-right:auto;letter-spacing:.5px;text-shadow:3px 3px 0 var(--paper)}
.stat{display:flex;align-items:center;gap:8px;padding:4px 16px 4px 12px;font-size:26px;font-variant-numeric:tabular-nums;min-height:56px}
.stat svg{width:30px;height:30px}
.stat small{font-size:16px;font-family:var(--font-body);font-weight:800}
#scoreBox.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.2) rotate(-5deg)}}
a.mini{text-decoration:none}
a.mini:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.mini{min-height:54px;min-width:54px;padding:0 12px;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.mini svg{width:24px;height:24px}
#playRow{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
#stage{flex:1;min-height:0;position:relative}
#stickArea{height:clamp(150px,25vh,230px);display:grid;place-items:center;touch-action:none;padding:8px}
#stickBase{height:100%;aspect-ratio:1;border-radius:50%;background:#F6DFA8;border:4px solid var(--ink);position:relative}
#stickBase svg{position:absolute;inset:0;width:100%;height:100%}
#stickKnob{position:absolute;left:28%;top:28%;width:44%;height:44%;border-radius:50%;background:#FFB52E;border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .12s}
#stickKnob.held{transition:none}
body.swipe #stickArea{display:none}
body.stick #hint{display:none}
@media (orientation:landscape) and (min-width:700px){
  #playRow{flex-direction:row}
  #stickArea{height:auto;width:clamp(200px,27vw,300px)}
  #stickBase{height:auto;width:100%}
}
#board{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:6px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);background:#F6DFA8}
#hint{text-align:center;font-family:var(--font-display);font-weight:600;font-size:18px;margin:0}
#overlay{position:absolute;inset:0;display:grid;place-items:center;z-index:3}
#overlay[hidden]{display:none}
#card{padding:20px 28px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:min(96%,560px);max-height:98%;overflow:auto}
#card h2{font-family:var(--font-display);font-weight:700;font-size:34px;margin:0;text-wrap:balance}
#cardSub{margin:0;font-size:18px}
#cardSub:empty{display:none}
#playBtn{background:var(--go);font-size:30px;padding:12px 38px;min-height:74px;border-radius:26px}
#opts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:4px}
.seg{display:flex;overflow:hidden;padding:0}
.seg button{border:0;background:transparent;padding:0 12px;min-height:46px;font-family:var(--font-display);font-weight:600;font-size:16px;display:flex;align-items:center;gap:5px}
.seg button + button{border-left:3px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg .emo{font-size:20px}
#toast{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%) scale(0);z-index:2;pointer-events:none;padding:8px 22px;font-size:clamp(24px,5vw,36px);white-space:nowrap;background:var(--go)}
#toast.show{animation:pop 1.1s both}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0) rotate(-8deg)}18%{transform:translate(-50%,-50%) scale(1.1) rotate(3deg)}28%,78%{transform:translate(-50%,-50%) scale(1) rotate(-2deg);opacity:1}100%{transform:translate(-50%,-50%) scale(.9);opacity:0}}
@media (prefers-reduced-motion:reduce){#toast.show{animation:none;transform:translate(-50%,-50%) scale(1)}#scoreBox.bump{animation:none}}
</style>
</head>
<body class="stick">
<div id="app">
  <header id="info">
    <h1>Berry Maze</h1>
    <div id="scoreBox" class="sticker stat" aria-live="polite" aria-label="Berries">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="14" r="6" fill="#E8336B" stroke="#3B2414" stroke-width="1.8"/><circle cx="15.5" cy="15" r="5.5" fill="#B83BD6" stroke="#3B2414" stroke-width="1.8"/><path d="M11 8c0-3 2-5 5-5" fill="none" stroke="#3DBE6C" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span id="score">0</span>
    </div>
    <div class="sticker stat"><small>Maze</small><span id="level">1</span></div>
    <a id="homeBtn" href="index.html" class="sticker mini" aria-label="Back to all games">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5L12 4l8.5 7.5" fill="none" stroke="#3B2414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9.5h4.5v-5h3v5H18V10" fill="none" stroke="#3B2414" stroke-width="2.6" stroke-linejoin="round"/></svg>
    </a>
    <button id="pauseBtn" class="sticker mini" aria-label="Pause">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5" fill="#3B2414"/><rect x="14" y="4" width="5" height="16" rx="1.5" fill="#3B2414"/></svg>
    </button>
  </header>
  <div id="playRow">
  <main id="stage">
    <canvas id="board" aria-label="Hedge maze"></canvas>
    <div id="toast" class="sticker" aria-hidden="true"></div>
    <div id="overlay">
      <div id="card" class="sticker">
        <h2 id="cardTitle">Help Pip eat the berries!</h2>
        <p id="cardSub">Push the joystick to move Pip. Grab a star to boop the fuzzies.</p>
        <button id="playBtn" class="sticker">Play</button>
        <div id="opts">
          <div class="seg sticker" role="group" aria-label="Speed">
            <button data-speed="turtle" aria-pressed="true"><span class="emo">🐢</span>Slow</button>
            <button data-speed="bunny" aria-pressed="false"><span class="emo">🐇</span>Medium</button>
            <button data-speed="cheetah" aria-pressed="false"><span class="emo">🐆</span>Fast</button>
          </div>
          <div class="seg sticker" role="group" aria-label="Controls">
            <button data-controls="stick" aria-pressed="true">Joystick</button>
            <button data-controls="swipe" aria-pressed="false">Swipe</button>
          </div>
          <button id="soundBtn" class="sticker mini" aria-pressed="true">Sound on</button>
        </div>
      </div>
    </div>
  </main>
  <div id="stickArea" class="sticker" aria-label="Joystick">
    <div id="stickBase">
      <svg viewBox="0 0 100 100" aria-hidden="true"><g fill="#3B2414" opacity=".35"><path d="M50 6l9 11H41z"/><path d="M50 94l9-11H41z"/><path d="M6 50l11-9v18z"/><path d="M94 50l-11-9v18z"/></g></svg>
      <div id="stickKnob"></div>
    </div>
  </div>
  </div>
  <p id="hint">Swipe anywhere to turn Pip. Tap to point the way.</p>
</div>
<script src="kidkit.js"></script>
<script>
(function(){
'use strict';
var KG=window.KG||{init:function(){},hard:function(){return false;},boost:function(){return 1;},error:function(){},banner:function(){},speak:function(){},pickWord:function(){return {word:'cat',pic:''};},wordBar:function(){return null;}};
var MAZES=[[
'###########',
'#o...#...o#',
'#.##.#.##.#',
'#.........#',
'#.##.#.##.#',
'#....#....#',
'#..#.F.#..#',
'#...FFF...#',
'#..#...#..#',
'#....#....#',
'#.##.#.##.#',
'#o...P...o#',
'###########'
],[
'###########',
'#o.......o#',
'#.#.###.#.#',
'#.#.....#.#',
'#...#.#...#',
'##.##.##.##',
'#....F....#',
'#.##FFF##.#',
'#....#....#',
'#.#.....#.#',
'#.#.#.#.#.#',
'#o...P...o#',
'###########'
]];
var COLS=11, ROWS=13, INK='#3B2414';
var SPEED={turtle:{p:2.8,f:1.6,smart:.3,n:2},bunny:{p:3.6,f:2.2,smart:.5,n:3},cheetah:{p:4.6,f:3,smart:.65,n:3}};
var FUZZ=['#FF6FA8','#B57BFF','#FF9F3D'];
var DIRS={left:{dx:-1,dy:0},right:{dx:1,dy:0},up:{dx:0,dy:-1},down:{dx:0,dy:1}};
function $(id){return document.getElementById(id);}
var cv=$('board'),ctx=cv.getContext('2d'),stage=$('stage'),overlay=$('overlay'),toastEl=$('toast');
var reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var S={speed:'turtle',sound:true,score:0,level:1,controls:'stick'};
var walls,berries,left,pip,fuzz,home,fuzzHomes,starT=0,playing=false,cs=36,clock=0,last=0,particles=[],clearT=0;

function open(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS&&!walls[y][x];}
function newMaze(){
  var m=MAZES[(S.level-1)%MAZES.length];
  walls=[];berries=[];left=0;fuzzHomes=[];
  for(var y=0;y<ROWS;y++){
    walls.push([]);berries.push([]);
    for(var x=0;x<COLS;x++){
      var ch=m[y][x];
      walls[y].push(ch==='#');
      berries[y].push(ch==='.'?1:ch==='o'?2:0);
      if(ch==='.'||ch==='o')left++;
      if(ch==='P')home={x:x,y:y};
      if(ch==='F')fuzzHomes.push({x:x,y:y});
    }
  }
  resetPip();
  var n=SPEED[S.speed].n;
  fuzz=[];
  for(var i=0;i<n;i++){
    var h=fuzzHomes[[2,1,3,0][i]%fuzzHomes.length];
    fuzz.push(mover(h.x,h.y,null,{col:FUZZ[i],wait:1.5+i*3,home:h}));
  }
  starT=0;clearT=0;particles=[];
}
function mover(x,y,dir,extra){
  var m={x:x,y:y,fx:x,fy:y,tx:x,ty:y,dir:dir};
  for(var k in extra)m[k]=extra[k];
  return m;
}
function resetPip(){pip=mover(home.x,home.y,null,{want:null,face:1,inv:0});}

/* Step a mover along its path. At each square's center it asks choose() which way to go next. */
function advance(m,dist,choose){
  var guard=0;
  while(dist>0&&guard++<8){
    if(!m.dir){
      var d0=choose(m);
      if(!d0||!open(m.x+d0.dx,m.y+d0.dy))return;
      m.dir=d0;m.fx=m.x;m.fy=m.y;m.tx=m.x+d0.dx;m.ty=m.y+d0.dy;
    }
    var rem=Math.abs(m.tx-m.x)+Math.abs(m.ty-m.y);
    if(dist>=rem){
      m.x=m.tx;m.y=m.ty;dist-=rem;
      var d=choose(m);
      if(d&&open(m.tx+d.dx,m.ty+d.dy))m.dir=d;
      else if(!open(m.tx+m.dir.dx,m.ty+m.dir.dy)){m.dir=null;return;}
      m.fx=m.tx;m.fy=m.ty;m.tx+=m.dir.dx;m.ty+=m.dir.dy;
    }else{
      m.x+=m.dir.dx*dist;m.y+=m.dir.dy*dist;dist=0;
    }
  }
}
function pipChoose(m){return m.want;}
function fuzzChoose(m){
  var opts=[],k,d,scared=starT>0;
  for(k in DIRS){
    d=DIRS[k];
    if(!open(m.tx+d.dx,m.ty+d.dy))continue;
    if(m.dir&&d.dx===-m.dir.dx&&d.dy===-m.dir.dy)continue;
    opts.push(d);
  }
  if(!opts.length)return m.dir?{dx:-m.dir.dx,dy:-m.dir.dy}:null;
  if(Math.random()<SPEED[S.speed].smart){
    opts.sort(function(a,b){
      var da=Math.abs(m.tx+a.dx-pip.x)+Math.abs(m.ty+a.dy-pip.y),db=Math.abs(m.tx+b.dx-pip.x)+Math.abs(m.ty+b.dy-pip.y);
      return scared?db-da:da-db;
    });
    return opts[0];
  }
  return opts[Math.floor(Math.random()*opts.length)];
}

function update(dt){
  clock+=dt;
  var sp=SPEED[S.speed];
  if(clearT>0){clearT-=dt;if(clearT<=0){S.level++;$('level').textContent=S.level;newMaze();toast('Maze '+S.level+'!');}return;}
  /* turning around works any time, not just at corners */
  if(pip.dir&&pip.want&&pip.want.dx===-pip.dir.dx&&pip.want.dy===-pip.dir.dy){
    var t=pip.tx;pip.tx=pip.fx;pip.fx=t;t=pip.ty;pip.ty=pip.fy;pip.fy=t;pip.dir=pip.want;
  }
  advance(pip,sp.p*dt,pipChoose);
  if(pip.dir&&pip.dir.dx)pip.face=pip.dir.dx;
  if(pip.inv>0)pip.inv-=dt;
  /* berries */
  var bx=Math.round(pip.x),by=Math.round(pip.y),b=berries[by]&&berries[by][bx];
  if(b){
    berries[by][bx]=0;left--;S.score++;showScore();
    if(b===2){starT=7;toast('Star power!');sfx.star();burst(bx,by,'#FFD84D',12);}
    else sfx.berry();
    if(!left){clearT=1.8;toast('All gone! Yum!');sfx.win();for(var i=0;i<6;i++)burst(2+i*1.4,6,FUZZ[i%3],10);return;}
  }
  if(starT>0)starT-=dt;
  /* fuzzies */
  fuzz.forEach(function(f){
    if(f.wait>0){f.wait-=dt;return;}
    advance(f,(starT>0?sp.f*.6:sp.f)*KG.boost()*dt,fuzzChoose);
    if(Math.hypot(f.x-pip.x,f.y-pip.y)<.6){
      if(starT>0){
        S.score+=5;showScore();burst(f.x,f.y,f.col,12);toast('Boop! +5');sfx.boop();
        var h=f.home;f.x=f.fx=f.tx=h.x;f.y=f.fy=f.ty=h.y;f.dir=null;f.wait=3;
      }else if(pip.inv<=0){
        toast('Oops! Back to start');KG.error();sfx.oops();resetPip();pip.inv=2;
      }
    }
  });
}
function burst(x,y,col,n){
  if(reduceMotion)return;
  for(var i=0;i<n;i++)particles.push({x:x+.5,y:y+.5,vx:(Math.random()-.5)*6,vy:-Math.random()*5-1,life:.6+Math.random()*.4,col:col,s:.12+Math.random()*.1});
}

/* ---------- drawing ---------- */
function ell(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function draw(){
  var dpr=window.devicePixelRatio||1,x,y;
  ctx.setTransform(dpr*cs,0,0,dpr*cs,0,0);
  ctx.fillStyle='#F6DFA8';ctx.fillRect(0,0,COLS,ROWS);
  /* hedges: each block reaches toward its hedge neighbors so walls read as one shape */
  var g=.1;
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    if(!walls[y][x])continue;
    ctx.fillStyle='#3E9E57';
    rrect(x+g,y+g,1-2*g,1-2*g,.22);ctx.fill();
    if(x+1<COLS&&walls[y][x+1])ctx.fillRect(x+.5,y+g,1,1-2*g);
    if(y+1<ROWS&&walls[y+1][x])ctx.fillRect(x+g,y+.5,1-2*g,1);
  }
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    if(!walls[y][x])continue;
    ctx.fillStyle='#5BBF6E';ell(x+.35,y+.38,.12,.1);ctx.fill();ell(x+.66,y+.62,.1,.08);ctx.fill();
  }
  /* berries and stars */
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    var b=berries[y][x];if(!b)continue;
    var cx=x+.5,cy=y+.5;
    if(b===1){
      ctx.fillStyle=(x+y)%2?'#E8336B':'#B83BD6';ctx.strokeStyle=INK;ctx.lineWidth=.05;
      ell(cx,cy,.13,.13);ctx.fill();ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.6)';ell(cx-.04,cy-.04,.035,.035);ctx.fill();
    }else{
      var s=.3+Math.sin(clock*5)*.04;
      ctx.fillStyle='#FFD84D';ctx.strokeStyle=INK;ctx.lineWidth=.06;star(cx,cy,s);ctx.fill();ctx.stroke();
    }
  }
  fuzz.forEach(fuzzy);
  if(!(pip.inv>0&&Math.floor(clock*10)%2===0))hedgehog(pip.x+.5,pip.y+.5,pip.face);
  particles.forEach(function(q){ctx.globalAlpha=Math.min(1,q.life*2.5);ctx.fillStyle=q.col;ctx.fillRect(q.x-q.s/2,q.y-q.s/2,q.s,q.s);});
  ctx.globalAlpha=1;
}
function star(x,y,r){
  ctx.beginPath();
  for(var i=0;i<10;i++){var rr=i%2?r*.45:r,an=-Math.PI/2+i*Math.PI/5;ctx[i?'lineTo':'moveTo'](x+Math.cos(an)*rr,y+Math.sin(an)*rr);}
  ctx.closePath();
}
function hedgehog(x,y,face){
  ctx.save();ctx.translate(x,y);ctx.scale(face,1);
  ctx.strokeStyle=INK;ctx.lineWidth=.05;ctx.lineJoin='round';
  ctx.fillStyle='#8A5A3A';
  ctx.beginPath();
  for(var i=0;i<=9;i++){
    var an=Math.PI*.55+i*Math.PI*1.1/9,r=i%2?.32:.44;
    ctx[i?'lineTo':'moveTo'](-.06+Math.cos(an)*r,.02+Math.sin(an)*r*.92);
  }
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#F6CFA0';ell(.12,.06,.27,.25);ctx.fill();ctx.stroke();
  ctx.fillStyle=INK;ell(.36,.04,.06,.05);ctx.fill();
  ell(.14,-.03,.045,.055);ctx.fill();
  ctx.fillStyle='#FF9BC8';ell(.06,.12,.05,.035);ctx.fill();
  ctx.lineCap='round';ctx.beginPath();ctx.arc(.24,.12,.07,Math.PI*.2,Math.PI*.8);ctx.stroke();
  ctx.fillStyle='#6E4428';ell(-.08,.36,.08,.05);ctx.fill();ell(.2,.36,.08,.05);ctx.fill();
  ctx.restore();
}
function fuzzy(f){
  var x=f.x+.5,y=f.y+.5,scared=starT>0,blink=scared&&starT<2&&Math.floor(clock*6)%2===0;
  var col=scared&&!blink?'#9AD4FF':f.col,bob=Math.sin(clock*6+f.home.x)*.03;
  ctx.strokeStyle=INK;ctx.lineWidth=.05;ctx.lineJoin='round';
  ctx.fillStyle=col;ctx.beginPath();
  for(var i=0;i<20;i++){var an=i*Math.PI/10,r=i%2?.33:.4;ctx[i?'lineTo':'moveTo'](x+Math.cos(an)*r,y+bob+Math.sin(an)*r);}
  ctx.closePath();ctx.fill();ctx.stroke();
  var lx=f.dir?f.dir.dx*.05:0,ly=f.dir?f.dir.dy*.05:0;
  if(scared){
    ctx.lineCap='round';
    ctx.beginPath();ctx.arc(x-.12,y-.04+bob,.06,Math.PI*.1,Math.PI*.9);ctx.stroke();
    ctx.beginPath();ctx.arc(x+.12,y-.04+bob,.06,Math.PI*.1,Math.PI*.9);ctx.stroke();
    ctx.beginPath();ell(x,y+.13+bob,.05,.04);ctx.stroke();
  }else{
    ctx.fillStyle='#fff';ell(x-.12,y-.05+bob,.1,.11);ctx.fill();ell(x+.12,y-.05+bob,.1,.11);ctx.fill();
    ctx.fillStyle=INK;ell(x-.12+lx,y-.05+ly+bob,.05,.055);ctx.fill();ell(x+.12+lx,y-.05+ly+bob,.05,.055);ctx.fill();
    ctx.lineCap='round';ctx.beginPath();ctx.arc(x,y+.08+bob,.08,Math.PI*.2,Math.PI*.8);ctx.stroke();
  }
}
function resize(){
  var w=stage.clientWidth-14,h=stage.clientHeight-22;
  cs=Math.max(12,Math.floor(Math.min(w/COLS,h/ROWS)));
  var dpr=window.devicePixelRatio||1;
  cv.style.width=COLS*cs+'px';cv.style.height=ROWS*cs+'px';
  cv.width=COLS*cs*dpr;cv.height=ROWS*cs*dpr;
  if(walls)draw();
}

/* ---------- input: swipe anywhere like a joystick, or tap to point Pip toward that spot ---------- */
var sw=null;
function dirOf(dx,dy){return Math.abs(dx)>Math.abs(dy)?(dx>0?DIRS.right:DIRS.left):(dy>0?DIRS.down:DIRS.up);}
window.addEventListener('pointerdown',function(e){
  if(!playing||S.controls!=='swipe'||e.target.closest('button'))return;
  e.preventDefault();sw={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};
});
window.addEventListener('pointermove',function(e){
  if(!sw||e.pointerId!==sw.id)return;
  var dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(Math.hypot(dx,dy)>22){pip.want=dirOf(dx,dy);sw.x=e.clientX;sw.y=e.clientY;sw.moved=true;}
});
window.addEventListener('pointerup',function(e){
  if(!sw||e.pointerId!==sw.id)return;
  if(!sw.moved&&playing){
    var r=cv.getBoundingClientRect(),px=(e.clientX-r.left)/cs-(pip.x+.5),py=(e.clientY-r.top)/cs-(pip.y+.5);
    if(Math.hypot(px,py)>.4)pip.want=dirOf(px,py);
  }
  sw=null;
});
window.addEventListener('pointercancel',function(){sw=null;});
/* joystick: push the knob and Pip heads that way, turning at the next corner */
var stick=null,area=$('stickArea'),base=$('stickBase'),knob=$('stickKnob');
function stickMove(e){
  var r=base.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  var dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.3,d=Math.hypot(dx,dy);
  if(d>max){dx*=max/d;dy*=max/d;}
  knob.style.transform='translate('+dx+'px,'+dy+'px)';
  if(d>r.width*.1&&playing)pip.want=dirOf(dx,dy);
}
area.addEventListener('pointerdown',function(e){
  e.preventDefault();e.stopPropagation();
  try{area.setPointerCapture(e.pointerId);}catch(err){}
  stick=e.pointerId;knob.classList.add('held');stickMove(e);
});
area.addEventListener('pointermove',function(e){if(e.pointerId===stick)stickMove(e);});
['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){area.addEventListener(ev,function(e){
  if(e.pointerId!==stick)return;
  stick=null;knob.classList.remove('held');knob.style.transform='';
});});
document.addEventListener('keydown',function(e){
  var m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];
  if(m&&playing){pip.want=DIRS[m];e.preventDefault();}
});
document.addEventListener('gesturestart',function(e){e.preventDefault();});

/* ---------- UI ---------- */
var toastTimer=null;
function toast(msg){toastEl.textContent=msg;toastEl.classList.remove('show');void toastEl.offsetWidth;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastEl.classList.remove('show');},1150);}
function showScore(){$('score').textContent=S.score;var b=$('scoreBox');b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');}
function syncOpts(){
  document.querySelectorAll('[data-speed]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.speed===S.speed));});
  document.querySelectorAll('[data-controls]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.controls===S.controls));});
  document.body.classList.toggle('stick',S.controls==='stick');document.body.classList.toggle('swipe',S.controls==='swipe');
  $('soundBtn').textContent=S.sound?'Sound on':'Sound off';$('soundBtn').setAttribute('aria-pressed',String(S.sound));
}
function save(){try{localStorage.setItem('berryMaze',JSON.stringify({speed:S.speed,sound:S.sound,controls:S.controls}));}catch(e){}}
var ac=null;
function initAudio(){try{if(!ac){var AC=window.AudioContext||window.webkitAudioContext;if(AC)ac=new AC();}if(ac&&ac.state==='suspended')ac.resume();}catch(e){ac=null;}}
function tone(f,d,type,v,when,f2){
  if(!ac||!S.sound)return;
  try{var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+(when||0);o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
var berryFlip=0;
var sfx={
  berry:function(){berryFlip=1-berryFlip;tone(berryFlip?660:880,.06,'triangle',.07);},
  star:function(){[523,784,1047].forEach(function(f,i){tone(f,.14,'triangle',.11,i*.07);});},
  boop:function(){tone(400,.18,'triangle',.13,0,1000);},
  oops:function(){tone(300,.25,'sine',.12,0,150);},
  win:function(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,.2,'triangle',.12,i*.1);});}
};
function play(){initAudio();playing=true;overlay.hidden=true;last=performance.now();}
function pause(){
  if(!playing)return;playing=false;sw=null;
  $('cardTitle').textContent='Taking a break';$('cardSub').textContent='';$('playBtn').textContent='Keep going';overlay.hidden=false;
}
$('playBtn').addEventListener('click',play);
$('pauseBtn').addEventListener('click',pause);
$('soundBtn').addEventListener('click',function(){S.sound=!S.sound;if(S.sound)initAudio();syncOpts();save();});
document.querySelectorAll('[data-speed]').forEach(function(b){b.addEventListener('click',function(){
  if(S.speed===b.dataset.speed)return;
  S.speed=b.dataset.speed;syncOpts();save();
  /* the number of fuzzies depends on speed, so add or remove to match */
  var n=SPEED[S.speed].n;
  while(fuzz.length>n)fuzz.pop();
  while(fuzz.length<n){var i=fuzz.length,h=fuzzHomes[[2,1,3,0][i]%fuzzHomes.length];fuzz.push(mover(h.x,h.y,null,{col:FUZZ[i],wait:2,home:h}));}
});});
document.querySelectorAll('[data-controls]').forEach(function(b){b.addEventListener('click',function(){
  S.controls=b.dataset.controls;syncOpts();save();
  $('cardSub').textContent=S.controls==='stick'?'Push the joystick to move Pip.':'Swipe or tap where you want Pip to go.';
});});
document.addEventListener('visibilitychange',function(){if(document.hidden)pause();});

function frame(t){
  var dt=Math.min(1/30,(t-last)/1000);last=t;
  if(dt>0){
    if(playing)update(dt);else clock+=dt;
    if(particles.length){particles.forEach(function(q){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=12*dt;q.life-=dt;});particles=particles.filter(function(q){return q.life>0;});}
  }
  draw();requestAnimationFrame(frame);
}
function start(data){
  data=data||{};
  try{var s=JSON.parse(localStorage.getItem('berryMaze')||'{}');if(SPEED[s.speed])S.speed=s.speed;if(typeof s.sound==='boolean')S.sound=s.sound;if(s.controls==='stick'||s.controls==='swipe')S.controls=s.controls;}catch(e){}
  if(typeof data.score==='number')S.score=data.score;
  if(typeof data.level==='number'&&data.level>=1)S.level=data.level;
  $('score').textContent=S.score;$('level').textContent=S.level;syncOpts();
  newMaze();resize();
  if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize',resize);
  last=performance.now();requestAnimationFrame(frame);
}
var hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(function(){return {score:S.score,level:S.level};});
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data?hot.data:{});
KG.init({game:'berry-maze',isPlaying:function(){return playing;},onBreak:function(){try{pause();}catch(e){}}});
})();
</script>
</body>
</html>
