<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bubble Garden</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kid Games">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: sticker book, garden edition. Header strip, a tall lawn, and a drag strip under it so a finger never covers the frog. */
:root{
  --page:#FFB8D9;
  --page-dot:#FFA3CD;
  --ink:#3A1F4F;
  --paper:#FFFBF2;
  --go:#7BE38F;
  --lawn:#7FD18B;
  --font-display:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --font-body:'Nunito','Avenir Next','Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background-color:var(--page);
  background-image:radial-gradient(var(--page-dot) 18%,transparent 19%);
  background-size:44px 44px;
  color:var(--ink);font-family:var(--font-body);font-weight:700;
  overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding:12px 16px 16px}
.sticker{font-family:var(--font-display);font-weight:600;color:var(--ink);background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink)}
button{cursor:pointer;font:inherit;color:inherit}
button.sticker:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}
#info{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,5vw,40px);line-height:1;margin:0;margin-right:auto;letter-spacing:.5px;text-shadow:3px 3px 0 var(--paper)}
.stat{display:flex;align-items:center;gap:8px;padding:4px 16px 4px 12px;font-size:26px;font-variant-numeric:tabular-nums;min-height:56px}
.stat svg{width:30px;height:30px}
.stat small{font-size:16px;font-family:var(--font-body);font-weight:800}
#scoreBox.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.2) rotate(-5deg)}}
a.mini{text-decoration:none}
a.mini:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.mini{min-height:54px;min-width:54px;padding:0 12px;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.mini svg{width:24px;height:24px}
#stage{flex:1;min-height:0;position:relative}
#board{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:6px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);background:var(--lawn)}
#dragZone{height:clamp(64px,11vh,100px);display:flex;align-items:center;justify-content:center;gap:10px;font-size:20px;border-style:dashed}
#dragZone svg{width:34px;height:34px}
#overlay{position:absolute;inset:0;display:grid;place-items:center;z-index:3}
#overlay[hidden]{display:none}
#card{padding:20px 28px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:min(96%,560px);max-height:98%;overflow:auto}
#card h2{font-family:var(--font-display);font-weight:700;font-size:34px;margin:0;text-wrap:balance}
#cardSub{margin:0;font-size:18px}
#cardSub:empty{display:none}
#playBtn{background:var(--go);font-size:30px;padding:12px 38px;min-height:74px;border-radius:26px}
#opts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:4px}
.seg{display:flex;overflow:hidden;padding:0}
.seg button{border:0;background:transparent;padding:0 12px;min-height:46px;font-family:var(--font-display);font-weight:600;font-size:16px;display:flex;align-items:center;gap:5px}
.seg button + button{border-left:3px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg .emo{font-size:20px}
#toast{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%) scale(0);z-index:2;pointer-events:none;padding:8px 22px;font-size:clamp(24px,5vw,36px);white-space:nowrap;background:#FFE066}
#toast.show{animation:pop 1.1s both}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0) rotate(-8deg)}18%{transform:translate(-50%,-50%) scale(1.1) rotate(3deg)}28%,78%{transform:translate(-50%,-50%) scale(1) rotate(-2deg);opacity:1}100%{transform:translate(-50%,-50%) scale(.9);opacity:0}}
@media (prefers-reduced-motion:reduce){#toast.show{animation:none;transform:translate(-50%,-50%) scale(1)}#scoreBox.bump{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header id="info">
    <h1>Bubble Garden</h1>
    <div id="scoreBox" class="sticker stat" aria-live="polite" aria-label="Score">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="#FFC400" stroke="#3A1F4F" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span id="score">0</span>
    </div>
    <div class="sticker stat"><small>Garden</small><span id="level">1</span></div>
    <a id="homeBtn" href="index.html" class="sticker mini" aria-label="Back to all games">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5L12 4l8.5 7.5" fill="none" stroke="#3A1F4F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9.5h4.5v-5h3v5H18V10" fill="none" stroke="#3A1F4F" stroke-width="2.6" stroke-linejoin="round"/></svg>
    </a>
    <button id="pauseBtn" class="sticker mini" aria-label="Pause">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5" fill="#3A1F4F"/><rect x="14" y="4" width="5" height="16" rx="1.5" fill="#3A1F4F"/></svg>
    </button>
  </header>
  <main id="stage">
    <canvas id="board" aria-label="Garden"></canvas>
    <div id="toast" class="sticker" aria-hidden="true"></div>
    <div id="overlay">
      <div id="card" class="sticker">
        <h2 id="cardTitle">Help Hoppy pop the bugs!</h2>
        <p id="cardSub">Drag your finger to move. Hoppy blows bubbles by himself.</p>
        <button id="playBtn" class="sticker">Play</button>
        <div id="opts">
          <div class="seg sticker" role="group" aria-label="Speed">
            <button data-speed="turtle" aria-pressed="true"><span class="emo">🐢</span>Slow</button>
            <button data-speed="bunny" aria-pressed="false"><span class="emo">🐇</span>Medium</button>
            <button data-speed="cheetah" aria-pressed="false"><span class="emo">🐆</span>Fast</button>
          </div>
          <button id="soundBtn" class="sticker mini" aria-pressed="true">Sound on</button>
        </div>
      </div>
    </div>
  </main>
  <div id="dragZone" class="sticker" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#3A1F4F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg>
    Drag anywhere to move
  </div>
</div>
<script>
(function(){
'use strict';
var COLS=11, ROWS=16, ZONE=4, INK='#3A1F4F';
var SPEED={turtle:{step:.32,len:6},bunny:{step:.22,len:8},cheetah:{step:.15,len:10}};
var SEGCOL=['#FF8A3D','#FFC93D','#FF6FA8','#9B7BFF','#4FC3F7'];
var FLOWERCOL=['#FF5A8A','#FFB020','#B57BFF','#FF7A5A','#4FC3F7'];
var CHEERS=['Pop!','Yay!','Super!','Nice!'];
function $(id){return document.getElementById(id);}
var cv=$('board'),ctx=cv.getContext('2d'),stage=$('stage'),overlay=$('overlay'),toastEl=$('toast');
var reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var S={speed:'turtle',sound:true,score:0,level:1};
var flowers,chains,bubbles,player,stepT=0,fireT=0,nextT=0,playing=false,cs=36,clock=0,last=0,particles=[],drag=null;

function inZone(y){return y>=ROWS-ZONE;}
function flowerAt(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS&&flowers[y][x]>0;}
function newGarden(){
  flowers=[];for(var y=0;y<ROWS;y++){flowers.push([]);for(var x=0;x<COLS;x++)flowers[y].push(0);}
  addFlowers(14);
  player={x:COLS/2,y:ROWS-.8,inv:0,face:0};
  bubbles=[];particles=[];
  spawnCaterpillar();
}
function addFlowers(n){
  var tries=0;
  while(n>0&&tries<400){
    tries++;
    var x=Math.floor(Math.random()*COLS),y=1+Math.floor(Math.random()*(ROWS-ZONE-2));
    if(!flowers[y][x]){flowers[y][x]=3;n--;}
  }
}
function spawnCaterpillar(){
  var len=SPEED[S.speed].len+Math.min(4,S.level-1),segs=[];
  for(var i=0;i<len;i++)segs.push({x:-1-i,y:0,px:-1-i,py:0});
  chains=[{segs:segs,dir:1,vdir:1}];
  stepT=0;
}
function stepChain(c){
  var h=c.segs[0],nx=h.x+c.dir,ny=h.y;
  if(nx<0&&h.x>=0||nx>=COLS||flowerAt(nx,h.y)){
    nx=h.x;c.dir=-c.dir;ny=h.y+c.vdir;
    if(ny>=ROWS){ny=ROWS-2;c.vdir=-1;}
    else if(c.vdir<0&&ny<ROWS-ZONE-1){ny=h.y+1;c.vdir=1;}
  }
  for(var i=c.segs.length-1;i>=0;i--){
    var s=c.segs[i];s.px=s.x;s.py=s.y;
    if(i>0){s.x=c.segs[i-1].x;s.y=c.segs[i-1].y;}
  }
  h.x=nx;h.y=ny;
}
function segPos(s,t){return {x:s.px+(s.x-s.px)*t+.5,y:s.py+(s.y-s.py)*t+.5};}

function update(dt){
  clock+=dt;
  var sp=SPEED[S.speed],t,i,j,k;
  if(chains.length){
    stepT+=dt;
    while(stepT>=sp.step){stepT-=sp.step;chains.forEach(stepChain);}
  }else{
    nextT-=dt;
    if(nextT<=0){S.level++;$('level').textContent=S.level;addFlowers(4);spawnCaterpillar();}
  }
  t=stepT/sp.step;
  /* bubbles */
  fireT-=dt;
  if(fireT<=0&&bubbles.length<3){fireT=.3;bubbles.push({x:player.x,y:player.y-.6});sfx.blow();}
  for(i=bubbles.length-1;i>=0;i--){
    var b=bubbles[i],hit=false;b.y-=16*dt;
    if(b.y<0){bubbles.splice(i,1);continue;}
    var fx=Math.floor(b.x),fy=Math.floor(b.y);
    if(flowerAt(fx,fy)){
      flowers[fy][fx]--;hit=true;
      if(!flowers[fy][fx]){burst(fx+.5,fy+.5,FLOWERCOL[(fx+fy)%FLOWERCOL.length],6);sfx.petal();}
    }
    for(j=0;j<chains.length&&!hit;j++){
      var c=chains[j];
      for(k=0;k<c.segs.length;k++){
        var p=segPos(c.segs[k],t);
        if(Math.abs(p.x-b.x)<.55&&Math.abs(p.y-b.y)<.6){
          hitSeg(j,k,p);hit=true;break;
        }
      }
    }
    if(hit)bubbles.splice(i,1);
  }
  /* bumping a bug sends Hoppy back home; nothing is lost */
  if(player.inv>0)player.inv-=dt;
  else chains.some(function(c){return c.segs.some(function(s){
    var p=segPos(s,t);
    if(Math.hypot(p.x-player.x,p.y-player.y)<.75){
      player.x=COLS/2;player.y=ROWS-.8;player.inv=1.5;drag=null;toast('Oops! Hop back!');sfx.oops();return true;
    }
    return false;
  });});
}
function hitSeg(j,k,p){
  var c=chains[j],s=c.segs[k];
  if(s.x>=0&&s.x<COLS&&s.y>=0&&s.y<ROWS&&!flowerAt(s.x,s.y))flowers[s.y][s.x]=3;
  var front=c.segs.slice(0,k),back=c.segs.slice(k+1);
  chains.splice(j,1);
  if(front.length)chains.push({segs:front,dir:c.dir,vdir:c.vdir});
  if(back.length)chains.push({segs:back,dir:c.dir,vdir:c.vdir});
  S.score+=k===0?2:1;showScore();
  burst(p.x,p.y,SEGCOL[k%SEGCOL.length],12);sfx.pop();
  if(!chains.length){nextT=1.6;toast('Garden saved!');sfx.win();}
  else if(Math.random()<.3)toast(CHEERS[Math.floor(Math.random()*CHEERS.length)]);
}
function burst(x,y,col,n){
  if(reduceMotion)return;
  for(var i=0;i<n;i++)particles.push({x:x,y:y,vx:(Math.random()-.5)*7,vy:-Math.random()*6-1,life:.6+Math.random()*.4,col:col,s:.12+Math.random()*.12});
}

/* ---------- drawing ---------- */
function ell(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);}
function draw(){
  var dpr=window.devicePixelRatio||1,x,y,i,t=chains&&chains.length?stepT/SPEED[S.speed].step:0;
  ctx.setTransform(dpr*cs,0,0,dpr*cs,0,0);
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    ctx.fillStyle=inZone(y)?((x+y)%2?'#A6E3A0':'#B5EAAE'):((x+y)%2?'#7FD18B':'#8ADB95');
    ctx.fillRect(x,y,1.02,1.02);
  }
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(0,ROWS-ZONE-.04,COLS,.08);
  /* flowers */
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    var hp=flowers[y][x];if(!hp)continue;
    var r=.15+hp*.08,cx=x+.5,cy=y+.5,col=FLOWERCOL[(x*3+y)%FLOWERCOL.length];
    ctx.fillStyle=col;ctx.strokeStyle=INK;ctx.lineWidth=.05;
    for(i=0;i<5;i++){var an=i*Math.PI*2/5-Math.PI/2;ell(cx+Math.cos(an)*r,cy+Math.sin(an)*r,r*.72,r*.72);ctx.fill();ctx.stroke();}
    ctx.fillStyle='#FFE066';ell(cx,cy,r*.6,r*.6);ctx.fill();ctx.stroke();
  }
  /* caterpillars: draw tail first so the head sits on top */
  chains.forEach(function(c){
    for(var k=c.segs.length-1;k>=0;k--){
      var p=segPos(c.segs[k],t);if(p.x<-.5)continue;
      var wob=Math.sin(clock*8+k)*.04;
      ctx.fillStyle=SEGCOL[k%SEGCOL.length];ctx.strokeStyle=INK;ctx.lineWidth=.06;
      ell(p.x,p.y+wob,.44,.42);ctx.fill();ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.4)';ell(p.x-.13,p.y-.16+wob,.13,.07);ctx.fill();
      if(k===0)face(p.x,p.y+wob,c);
    }
  });
  /* bubbles */
  bubbles.forEach(function(b){
    ctx.fillStyle='rgba(200,240,255,.75)';ctx.strokeStyle='#3FA7E8';ctx.lineWidth=.05;
    ell(b.x,b.y,.2,.2);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ell(b.x-.07,b.y-.07,.05,.05);ctx.fill();
  });
  /* Hoppy the frog */
  if(!(player.inv>0&&Math.floor(clock*10)%2===0))frog(player.x,player.y);
  particles.forEach(function(q){ctx.globalAlpha=Math.min(1,q.life*2.5);ctx.fillStyle=q.col;ctx.fillRect(q.x-q.s/2,q.y-q.s/2,q.s,q.s);});
  ctx.globalAlpha=1;
}
function face(x,y,c){
  var d=c.dir;
  ctx.strokeStyle=INK;ctx.lineWidth=.05;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x-.14,y-.36);ctx.lineTo(x-.24,y-.62);ctx.moveTo(x+.14,y-.36);ctx.lineTo(x+.24,y-.62);ctx.stroke();
  ctx.fillStyle='#FF6FA8';ell(x-.24,y-.62,.07,.07);ctx.fill();ell(x+.24,y-.62,.07,.07);ctx.fill();
  ctx.fillStyle='#fff';ell(x-.13+d*.06,y-.08,.11,.12);ctx.fill();ell(x+.13+d*.06,y-.08,.11,.12);ctx.fill();
  ctx.fillStyle=INK;ell(x-.11+d*.09,y-.06,.055,.06);ctx.fill();ell(x+.15+d*.09,y-.06,.055,.06);ctx.fill();
  ctx.beginPath();ctx.arc(x+d*.04,y+.1,.12,Math.PI*.15,Math.PI*.85);ctx.stroke();
}
function frog(x,y){
  ctx.strokeStyle=INK;ctx.lineWidth=.06;
  ctx.fillStyle='#3FBF5A';ell(x-.38,y+.28,.2,.12);ctx.fill();ctx.stroke();ell(x+.38,y+.28,.2,.12);ctx.fill();ctx.stroke();
  ctx.fillStyle='#55D46E';ell(x,y+.05,.46,.36);ctx.fill();ctx.stroke();
  ctx.fillStyle='#C9F5B8';ell(x,y+.14,.28,.2);ctx.fill();
  ctx.fillStyle='#55D46E';ell(x-.22,y-.3,.17,.17);ctx.fill();ctx.stroke();ell(x+.22,y-.3,.17,.17);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ell(x-.22,y-.32,.11,.11);ctx.fill();ell(x+.22,y-.32,.11,.11);ctx.fill();
  ctx.fillStyle=INK;ell(x-.21,y-.35,.055,.055);ctx.fill();ell(x+.23,y-.35,.055,.055);ctx.fill();
  ctx.fillStyle='#FF9BC8';ell(x-.3,y,.07,.045);ctx.fill();ell(x+.3,y,.07,.045);ctx.fill();
  ctx.lineCap='round';ctx.beginPath();ctx.arc(x,y-.08,.14,Math.PI*.2,Math.PI*.8);ctx.stroke();
}
function resize(){
  var w=stage.clientWidth-14,h=stage.clientHeight-22;
  cs=Math.max(12,Math.floor(Math.min(w/COLS,h/ROWS)));
  var dpr=window.devicePixelRatio||1;
  cv.style.width=COLS*cs+'px';cv.style.height=ROWS*cs+'px';
  cv.width=COLS*cs*dpr;cv.height=ROWS*cs*dpr;
  if(flowers)draw();
}

/* ---------- input: drag anywhere; Hoppy moves with the finger but keeps his distance from it ---------- */
function boardPt(e){var r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/cs,y:(e.clientY-r.top)/cs};}
window.addEventListener('pointerdown',function(e){
  if(!playing||e.target.closest('button'))return;
  e.preventDefault();
  var p=boardPt(e);drag={id:e.pointerId,ox:player.x-p.x,oy:player.y-p.y};
});
window.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.id||!playing)return;
  var p=boardPt(e);
  player.x=Math.max(.5,Math.min(COLS-.5,p.x+drag.ox));
  player.y=Math.max(ROWS-ZONE+.5,Math.min(ROWS-.5,p.y+drag.oy));
});
['pointerup','pointercancel'].forEach(function(ev){window.addEventListener(ev,function(e){if(drag&&e.pointerId===drag.id)drag=null;});});
document.addEventListener('keydown',function(e){
  if(!playing)return;
  if(e.key==='ArrowLeft')player.x=Math.max(.5,player.x-.5);
  else if(e.key==='ArrowRight')player.x=Math.min(COLS-.5,player.x+.5);
  else if(e.key==='ArrowUp')player.y=Math.max(ROWS-ZONE+.5,player.y-.5);
  else if(e.key==='ArrowDown')player.y=Math.min(ROWS-.5,player.y+.5);
  else return;
  e.preventDefault();
});
document.addEventListener('gesturestart',function(e){e.preventDefault();});

/* ---------- UI ---------- */
var toastTimer=null;
function toast(msg){toastEl.textContent=msg;toastEl.classList.remove('show');void toastEl.offsetWidth;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastEl.classList.remove('show');},1150);}
function showScore(){$('score').textContent=S.score;var b=$('scoreBox');b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');}
function syncOpts(){
  document.querySelectorAll('[data-speed]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.speed===S.speed));});
  $('soundBtn').textContent=S.sound?'Sound on':'Sound off';$('soundBtn').setAttribute('aria-pressed',String(S.sound));
}
function save(){try{localStorage.setItem('bubbleGarden',JSON.stringify({speed:S.speed,sound:S.sound}));}catch(e){}}
var ac=null;
function initAudio(){try{if(!ac){var AC=window.AudioContext||window.webkitAudioContext;if(AC)ac=new AC();}if(ac&&ac.state==='suspended')ac.resume();}catch(e){ac=null;}}
function tone(f,d,type,v,when,f2){
  if(!ac||!S.sound)return;
  try{var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+(when||0);o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
var sfx={
  blow:function(){tone(900,.05,'sine',.025,0,1300);},
  pop:function(){tone(700,.12,'triangle',.13,0,1400);},
  petal:function(){tone(500,.08,'triangle',.08);},
  oops:function(){tone(300,.25,'sine',.12,0,150);},
  win:function(){[523,659,784,1047].forEach(function(f,i){tone(f,.2,'triangle',.12,i*.1);});}
};
function play(){initAudio();playing=true;overlay.hidden=true;last=performance.now();}
function pause(){
  if(!playing)return;playing=false;drag=null;
  $('cardTitle').textContent='Taking a break';$('cardSub').textContent='';$('playBtn').textContent='Keep going';overlay.hidden=false;
}
$('playBtn').addEventListener('click',play);
$('pauseBtn').addEventListener('click',pause);
$('soundBtn').addEventListener('click',function(){S.sound=!S.sound;if(S.sound)initAudio();syncOpts();save();});
document.querySelectorAll('[data-speed]').forEach(function(b){b.addEventListener('click',function(){S.speed=b.dataset.speed;syncOpts();save();});});
document.addEventListener('visibilitychange',function(){if(document.hidden)pause();});

function frame(t){
  var dt=Math.min(1/30,(t-last)/1000);last=t;
  if(dt>0){
    if(playing)update(dt);else clock+=dt;
    if(particles.length){particles.forEach(function(q){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=14*dt;q.life-=dt;});particles=particles.filter(function(q){return q.life>0;});}
  }
  draw();requestAnimationFrame(frame);
}
function start(data){
  data=data||{};
  try{var s=JSON.parse(localStorage.getItem('bubbleGarden')||'{}');if(SPEED[s.speed])S.speed=s.speed;if(typeof s.sound==='boolean')S.sound=s.sound;}catch(e){}
  if(typeof data.score==='number')S.score=data.score;
  if(typeof data.level==='number'&&data.level>=1)S.level=data.level;
  $('score').textContent=S.score;$('level').textContent=S.level;syncOpts();
  newGarden();resize();
  if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize',resize);
  last=performance.now();requestAnimationFrame(frame);
}
var hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(function(){return {score:S.score,level:S.level};});
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data?hot.data:{});
})();
</script>
</body>
</html>
